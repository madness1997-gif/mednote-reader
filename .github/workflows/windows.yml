name: Build MedNote for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/windows-build-trigger
      - .github/workflows/windows.yml
      - app/**
      - electron/**
      - src/**
      - package.json
      - package-lock.json
      - vite.desktop.config.ts
      - vite.desktop-pdf-canvas-budget.ts
      - vite.pdf-assets.ts

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test:unit
      - name: Build desktop renderer
        run: npm run build:desktop
      - name: Smoke test Electron runtime
        run: node tests/electron-smoke.cjs
      - name: Package Windows installer
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: MedNote-Reader-Windows
          path: release/MedNote-Reader-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
