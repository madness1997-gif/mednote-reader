name: Build MedNote for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: MedNote-Reader-Windows
          path: release/MedNote-Reader-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.1.7 "release/MedNote-Reader-Setup-1.1.7.exe" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "MedNote Reader 1.1.7" --notes "Windows installer with the latest Word-style Type toolbar and note image improvements."
