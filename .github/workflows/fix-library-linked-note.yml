name: Fix Library linked note
on:
  push:
    branches: [fix/library-document-linked-note]
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/library-document-linked-note
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch Library document click
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text()
          old = '''                        <button className={`library-item ${item.id === activeWorkspace.id ? "active" : ""}`} disabled={!workspace} onClick={() => {\n                          if (!workspace) return setToast("Document runtime chưa sẵn sàng");\n                          activeWorkspaceIdRef.current = item.id;\n                          setActiveWorkspaceId(item.id);\n                          workspaceModeRef.current = "reader";\n                          setWorkspaceMode("reader");\n                          setLibraryOpen(false);\n                        }}>\n'''
          new = '''                        <button className={`library-item ${item.id === activeWorkspace.id ? "active" : ""}`} disabled={!workspace} onClick={() => {\n                          if (!workspace) return setToast("Document runtime chưa sẵn sàng");\n                          void (async () => {\n                            const currentNotebookId = noteStore.getSnapshot().structure?.active.activeNotebookId || null;\n                            const linkedNotebookId = currentNotebookId && item.linkedNotebookIds.includes(currentNotebookId)\n                              ? currentNotebookId\n                              : item.linkedNotebookIds[0] || null;\n                            if (linkedNotebookId) {\n                              try {\n                                await noteStore.openNotebook(linkedNotebookId);\n                              } catch (error) {\n                                setToast(error instanceof Error ? error.message : "Không thể mở Notebook liên kết");\n                              }\n                            }\n                            activeWorkspaceIdRef.current = item.id;\n                            setActiveWorkspaceId(item.id);\n                            workspaceModeRef.current = "reader";\n                            setWorkspaceMode("reader");\n                            setLibraryOpen(false);\n                          })();\n                        }}>\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one Library document click block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install and validate
        run: |
          npm ci
          npm run typecheck
          npm run test:p65
          npm run test:p4
          npm run test:p5
          npm run test:p6
          npm run build:pages
          npm run build:desktop
      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/fix-library-linked-note.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/fix-library-linked-note.yml
          git commit -m "Open linked note when selecting Library document"
          git push origin HEAD:fix/library-document-linked-note
