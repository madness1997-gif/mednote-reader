name: Improve Note Sidebar Toggle

on:
  push:
    branches: [agent/improve-note-sidebar-toggle]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/improve-note-sidebar-toggle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Make Note sidebar toggle explicit
        run: |
          python - <<'PY'
          from pathlib import Path

          sidebar = Path('app/note-sidebar.tsx')
          text = sidebar.read_text()
          old = '<button type="button" onClick={onRequestClose} title="Thu gọn" aria-label="Thu gọn điều hướng"><X size={16} /></button>'
          new = '<button type="button" className="note-sidebar-collapse-button" onClick={onRequestClose} title="Ẩn thanh điều hướng Note" aria-label="Ẩn thanh điều hướng Note"><span>Ẩn</span><ChevronRight size={17} /></button>'
          assert old in text
          text = text.replace(old, new, 1)
          sidebar.write_text(text)

          page = Path('app/page.tsx')
          text = page.read_text()
          old = '{!showNoteSidebar && <button className="icon-button compact" onClick={() => setNoteSidebarVisibility(true)} aria-label="Hiện điều hướng ghi chú" title="Hiện điều hướng ghi chú"><PanelRightOpen size={17} /></button>}'
          new = '{!showNoteSidebar && <button className="note-sidebar-show-button" onClick={() => setNoteSidebarVisibility(true)} aria-label="Hiện thanh điều hướng Note" title="Hiện thanh điều hướng Note"><PanelRightOpen size={16} /><span>Điều hướng Note</span></button>}'
          assert old in text
          text = text.replace(old, new, 1)
          page.write_text(text)

          css = Path('app/globals.css')
          text = css.read_text()
          marker = '.icon-button.compact { width: 32px; height: 32px; }\n'
          assert marker in text
          addition = '''.note-sidebar-show-button { height: 32px; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 0 9px; border: 1px solid #d4c4df; border-radius: 8px; background: #f7f2fa; color: #5c2d91; font-size: 10px; font-weight: 750; white-space: nowrap; cursor: pointer; }\n.note-sidebar-show-button:hover { border-color: #a889bd; background: #eee5f4; color: #42145f; }\n.note-sidebar-show-button:focus-visible { outline: 2px solid rgba(92,45,145,.28); outline-offset: 2px; }\n'''
          text = text.replace(marker, marker + addition, 1)
          css.write_text(text)

          sidebar_css = Path('app/note-sidebar.css')
          text = sidebar_css.read_text()
          marker = '.note-sidebar-bookbar > button:hover { background: #ececef; color: #292929; }\n'
          assert marker in text
          addition = '''.note-sidebar-bookbar > .note-sidebar-collapse-button { width: auto; flex: 0 0 auto; display: inline-flex; grid-auto-flow: column; align-items: center; gap: 3px; padding: 0 7px; border: 1px solid #ddd0e6; background: #f7f2fa; color: #5c2d91; font-weight: 750; }\n.note-sidebar-bookbar > .note-sidebar-collapse-button:hover { border-color: #b59ac8; background: #eee5f4; color: #42145f; }\n.note-sidebar-collapse-button span { font-size: 10px; line-height: 1; }\n'''
          text = text.replace(marker, marker + addition, 1)
          sidebar_css.write_text(text)

          test_file = Path('tests-unit/wave4.test.ts')
          text = test_file.read_text()
          old = '''test("Wave 4 toolbar delegates hierarchy CRUD to the React sidebar", async () => {\n  const page = await readFile(new URL("../app/page.tsx", import.meta.url), "utf8");\n  const start = page.indexOf('<div className={`note-toolbar');'''
          new = '''test("Wave 4 toolbar delegates hierarchy CRUD to the React sidebar", async () => {\n  const page = await readFile(new URL("../app/page.tsx", import.meta.url), "utf8");\n  const sidebar = await readFile(new URL("../app/note-sidebar.tsx", import.meta.url), "utf8");\n  const start = page.indexOf('<div className={`note-toolbar');'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''  assert.match(toolbar, /Từng trang/);\n  assert.match(toolbar, /Liên tục/);\n  assert.match(toolbar, /Xuất note/);\n});'''
          new = '''  assert.match(toolbar, /Từng trang/);\n  assert.match(toolbar, /Liên tục/);\n  assert.match(toolbar, /Xuất note/);\n  assert.match(toolbar, /note-sidebar-show-button/);\n  assert.match(toolbar, /Điều hướng Note/);\n  assert.match(sidebar, /note-sidebar-collapse-button/);\n  assert.match(sidebar, /<span>Ẩn<\\/span><ChevronRight/);\n  assert.doesNotMatch(sidebar, /title="Thu gọn" aria-label="Thu gọn điều hướng"><X/);\n});'''
          assert old in text
          text = text.replace(old, new, 1)
          test_file.write_text(text)

          e2e = Path('tests/sidebar-controls.spec.cjs')
          text = e2e.read_text()
          old = "getByRole('button', { name: 'Thu gọn điều hướng' })"
          new = "getByRole('button', { name: 'Ẩn thanh điều hướng Note' })"
          assert old in text
          text = text.replace(old, new, 1)
          old = "getByRole('button', { name: 'Hiện điều hướng ghi chú' })"
          new = "getByRole('button', { name: 'Hiện thanh điều hướng Note' })"
          assert old in text
          text = text.replace(old, new, 1)
          e2e.write_text(text)
          PY
      - name: Validate
        run: |
          npm run typecheck
          npm run test:wave4
          npx playwright install --with-deps chromium
          npm run test:all
          npm run build:pages
      - name: Commit validated UI change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css app/note-sidebar.tsx app/note-sidebar.css tests-unit/wave4.test.ts tests/sidebar-controls.spec.cjs
          git commit -m "Make Note sidebar toggle more intuitive"
          git push origin HEAD:agent/improve-note-sidebar-toggle
