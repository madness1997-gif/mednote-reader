name: Update dormant First Aid boundary assertions

on:
  push:
    branches:
      - fix/fa-dormant-semantics

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Assert First Aid transition boundary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fa-dormant-semantics
      - name: Patch stale boundary test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests-unit/first-aid-template-boundary.test.ts')
          source = path.read_text()
          old = '''  assert.match(page, /body: firstAidDocumentPlainText\\(activeNote\\.firstAid\\)/);\n  assert.match(page, /firstAid: normalizeFirstAidDocument\\(activeNote\\.firstAid\\) \\?\\? firstAidDocumentFromLegacy/);'''
          new = '''  assert.match(page, /firstAidTemplateTransition\\(\\{/);\n  assert.match(page, /firstAid: activeNote\\.firstAid/);\n  assert.match(page, /\\.\\.\\.transition/);\n  assert.doesNotMatch(page, /body: firstAidDocumentPlainText\\(activeNote\\.firstAid\\)/);\n  assert.match(adapter, /firstAidDocumentMatchesRegularProjection/);\n  assert.match(adapter, /dormantStillRepresentsActiveBody/);\n  assert.match(adapter, /firstAidDocumentFromLegacy\\(input\\.bodyHtml, input\\.body\\)/);'''
          assert old in source, 'old transition assertions changed unexpectedly'
          source = source.replace(old, new, 1)
          path.write_text(source)

          workflow = Path('.github/workflows/fa-dormant-test-patch.yml')
          if workflow.exists(): workflow.unlink()
          PY
      - name: Commit boundary test
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests-unit/first-aid-template-boundary.test.ts .github/workflows/fa-dormant-test-patch.yml
          git commit -m "Assert First Aid transition boundary"
          git push origin HEAD:fix/fa-dormant-semantics
