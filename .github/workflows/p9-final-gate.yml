name: P9 final gate

on:
  push:
    branches: [p9-ui-component-split]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p9-ui-component-split
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: P3 gate
        run: npm run test:p3
      - name: P4 gate
        run: npm run test:p4
      - name: P5 gate
        run: npm run test:p5
      - name: P6 gate
        run: npm run test:p6
      - name: P6.5 gate
        run: npm run test:p65
      - name: P7 gate
        run: npm run test:p7
      - name: P8 gate
        run: npm run test:p8
      - name: P9 gate
        run: npm run test:p9
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright regression gate
        run: npm run test:all
      - name: Web build
        run: npm run build:pages
      - name: Desktop build
        run: npm run build:desktop
      - name: Remove final gate workflow
        if: success()
        run: |
          git config user.name "Dũng"
          git config user.email "61448424+madness1997-gif@users.noreply.github.com"
          git rm .github/workflows/p9-final-gate.yml
          git commit -m "P9 remove final gate workflow"
          git push origin HEAD:p9-ui-component-split
