name: Fix Live Drive Hash

on:
  push:
    branches: [agent/fix-live-drive-hash]

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-live-drive-hash
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply compatibility and deploy-gate fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          drive = Path('app/drive-backup.ts')
          text = drive.read_text()
          old = 'const LEGACY_PRE_JSON_HASH_CUTOFF = 1786422600000;'
          new = 'export const DRIVE_SHEET_HASH_ALGORITHM = "json-safe-v1" as const;'
          assert old in text
          text = text.replace(old, new, 1)
          old = '''  exportedAt: number;\n  sheetContentHashes: Record<string, string>;'''
          new = '''  exportedAt: number;\n  sheetHashAlgorithm?: typeof DRIVE_SHEET_HASH_ALGORITHM;\n  sheetContentHashes: Record<string, string>;'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    exportedAt: Date.now(),\n    sheetContentHashes: hashesFor(snapshot),'''
          new = '''    exportedAt: Date.now(),\n    sheetHashAlgorithm: DRIVE_SHEET_HASH_ALGORITHM,\n    sheetContentHashes: hashesFor(snapshot),'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''  if (hashMismatch) {\n    // Manifests written before the JSON-canonical hash fix could contain hashes\n    // calculated from optional undefined properties that JSON later removed.\n    // That old hash cannot be reconstructed from the downloaded JSON. Accept\n    // only that bounded compatibility window when the Sheet ID set itself is\n    // intact; all newer manifests remain strict.\n    const isLegacyPreJsonHash = sameHashKeys\n      && Number.isFinite(backup.exportedAt)\n      && Number(backup.exportedAt) < LEGACY_PRE_JSON_HASH_CUTOFF;\n    if (!isLegacyPreJsonHash) throw new Error("Hash nội dung Sheet trong bản lưu Drive không khớp");\n  }'''
          new = '''  if (hashMismatch) {\n    // Older v2 manifests did not identify the hash algorithm. Some of those\n    // hashes were calculated before JSON serialization removed optional\n    // undefined fields, so the downloaded JSON cannot reproduce the old hash.\n    // New manifests carry an explicit algorithm marker and remain strict.\n    const legacyHashesAreStructurallyComplete = backup.sheetHashAlgorithm === undefined\n      && sameHashKeys\n      && Number.isFinite(backup.exportedAt)\n      && Object.values(expectedHashes).every((hash) => typeof hash === "string" && hash.length > 0);\n    if (!legacyHashesAreStructurallyComplete) throw new Error("Hash nội dung Sheet trong bản lưu Drive không khớp");\n  }'''
          assert old in text
          text = text.replace(old, new, 1)
          drive.write_text(text)

          unit = Path('tests-unit/drive-sync-service.test.ts')
          text = unit.read_text()
          marker = 'test("corrupt v2 aborts before local cutover", async () => {'
          assert marker in text
          addition = '''test("unmarked legacy v2 hash remains restorable even when written after the old cutoff", () => {\n  const backup = createDriveBackup(library({ body: "legacy json hash" }));\n  delete backup.sheetHashAlgorithm;\n  backup.exportedAt = Date.now();\n  backup.sheetContentHashes.sheet = "legacy-pre-json-hash";\n  const restored = parseDriveBackup(JSON.parse(JSON.stringify(backup)));\n  assert.equal(restored.sheetContents.sheet.body, "legacy json hash");\n});\n\ntest("unmarked legacy v2 still rejects an incomplete Sheet hash set", () => {\n  const backup = createDriveBackup(library());\n  delete backup.sheetHashAlgorithm;\n  delete backup.sheetContentHashes.sheet;\n  assert.throws(() => parseDriveBackup(JSON.parse(JSON.stringify(backup))), /Hash nội dung Sheet/);\n});\n\n'''
          text = text.replace(marker, addition + marker, 1)
          unit.write_text(text)

          e2e = Path('tests/pdf-note-lifecycle.spec.cjs')
          text = e2e.read_text()
          marker = "test('preview, PDF persistence, note creation, and PDF deletion remain independent'"
          assert marker in text
          helper = '''async function waitForAppReady(page) {\n  await expect.poll(() => page.evaluate(() => {\n    const raw = localStorage.getItem('mednote-document-runtime-v1');\n    if (!raw) return false;\n    try {\n      const snapshot = JSON.parse(raw);\n      return Array.isArray(snapshot?.workspaces) && snapshot.workspaces.length > 0;\n    } catch {\n      return false;\n    }\n  }), { timeout: 10000 }).toBe(true);\n}\n\n'''
          text = text.replace(marker, helper + marker, 1)
          old = '''  await page.goto(APP_URL, { waitUntil: 'domcontentloaded' });\n  await page.locator('input[data-pdf-input="preview"]').setInputFiles({'''
          new = '''  await page.goto(APP_URL, { waitUntil: 'domcontentloaded' });\n  await waitForAppReady(page);\n  await page.locator('input[data-pdf-input="preview"]').setInputFiles({'''
          assert text.count(old) >= 2
          text = text.replace(old, new, 2)
          e2e.write_text(text)

          pages = Path('.github/workflows/pages.yml')
          text = pages.read_text()
          old = '''          npm run test:wave3\n          npm run test:wave4'''
          new = '''          npm run test:wave3\n          npm run test:wave4\n          npm run test:p3\n          npm run test:p4\n          npm run test:p5\n          npm run test:p6\n          npm run test:p65'''
          assert old in text
          text = text.replace(old, new, 1)
          pages.write_text(text)
          PY
      - name: Typecheck and architecture regressions
        run: |
          npm run typecheck
          npm run test:wave1
          npm run test:wave2
          npm run test:wave3
          npm run test:wave4
          npm run test:p3
          npm run test:p4
          npm run test:p5
          npm run test:p6
          npm run test:p65
      - name: Browser regressions
        run: |
          npx playwright install --with-deps chromium
          npm run test:all
      - name: Build web and desktop
        env:
          VITE_GOOGLE_CLIENT_ID: 647663227509-gcrelfm08dbli66ku94vjgpqj8fn9goi.apps.googleusercontent.com
        run: |
          npm run build:pages
          npm run build:desktop
      - name: Commit validated fix
        run: |
          rm .github/workflows/fix-live-drive-hash.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/drive-backup.ts tests-unit/drive-sync-service.test.ts tests/pdf-note-lifecycle.spec.cjs .github/workflows/pages.yml .github/workflows/fix-live-drive-hash.yml
          git commit -m "Fix legacy Drive hashes and restore Pages deployment [live-fix-bot]"
          git push origin HEAD:agent/fix-live-drive-hash
