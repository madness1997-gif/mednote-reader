name: P7 core validate
on:
  push:
    branches: [p7-pdf-runtime]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[p7-core]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p7-pdf-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch dependency direction and test script
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('app/pdf-reader.tsx'); t=p.read_text()
          start=t.index('export type PdfTool =')
          end=t.index('type PageViewport =')
          block='import type { PdfAnnotation, PdfCropResult, PdfFitMode, PdfMarkupAnnotation, PdfPoint, PdfRect, PdfSelection, PdfTool, PdfViewMode } from "./pdf-domain";\nexport type { PdfAnnotation, PdfCropResult, PdfFitMode, PdfInkAnnotation, PdfMarkupAnnotation, PdfObjectAnnotation, PdfPoint, PdfRect, PdfSelection, PdfTool, PdfViewMode } from "./pdf-domain";\n\n'
          p.write_text(t[:start]+block+t[end:])
          p=Path('app/document-runtime-adapter.ts'); t=p.read_text(); p.write_text(t.replace('import type { PdfAnnotation, PdfFitMode, PdfViewMode } from "./pdf-reader";','import type { PdfAnnotation, PdfFitMode, PdfViewMode } from "./pdf-domain";'))
          p=Path('package.json'); t=p.read_text();
          if '"test:p7"' not in t:
            t=t.replace('"test:p65": "node --import tsx --test tests-unit/library-projection.test.ts",','"test:p65": "node --import tsx --test tests-unit/library-projection.test.ts",\n    "test:p7": "node --import tsx --test tests-unit/pdf-reader-controller.test.ts tests-unit/pdf-annotation-session.test.ts tests-unit/pdf-document-export.test.ts",')
          p.write_text(t)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:p7
      - name: Commit validated core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/p7-core-validate.yml
          git add app/pdf-reader.tsx app/document-runtime-adapter.ts package.json .github/workflows/p7-core-validate.yml
          git commit -m "P7.0 establish PDF domain boundary [p7-core]"
          git push origin HEAD:p7-pdf-runtime
