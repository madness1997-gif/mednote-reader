name: Verify Sidebar Collapse

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sidebar-collapse-live
  cancel-in-progress: true

jobs:
  verify-sidebar-collapse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for matching live deploy
        run: |
          set -euo pipefail
          url="https://madness1997-gif.github.io/mednote-reader/deploy-version.txt"
          for i in $(seq 1 90); do
            live=$(curl -fsSL "${url}?v=${GITHUB_SHA}-${i}" || true)
            if [ "${live}" = "${GITHUB_SHA}" ]; then
              echo "Live commit ${GITHUB_SHA} is ready"
              exit 0
            fi
            sleep 4
          done
          echo "Live site did not refresh to ${GITHUB_SHA}"
          exit 1
      - name: Install browser verifier
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @playwright/test@1.54.2
          npx playwright install --with-deps chromium
      - name: Verify hide and restore sidebar
        run: |
          node - <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 980, height: 1500 },
              hasTouch: true,
              isMobile: false,
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });

            await page.addInitScript(() => {
              const now = Date.now();
              const notePage = {
                id: 'collapse-page-1', title: 'Sidebar collapse test', titleHtml: 'Sidebar collapse test',
                body: 'Test', bodyHtml: '<p>Test</p>', citationPage: null, strokes: [], excerpts: [],
                paper: { size: 'a4', orientation: 'portrait', template: 'first-aid', color: 'white' },
                text: { font: 'times', size: 12, color: 'auto', bold: false, italic: false, underline: false, align: 'left' },
              };
              const notebook = { id: 'collapse-notebook-1', title: 'Collapse test', pages: [notePage], activePageId: notePage.id, createdAt: now };
              localStorage.clear();
              sessionStorage.clear();
              localStorage.setItem('mednote-library-v2', JSON.stringify({
                workspaces: [{
                  id: 'collapse-workspace-1', kind: 'empty', name: 'Collapse test', documents: [], activeDocumentId: null,
                  notebooks: [notebook], activeNotebookId: notebook.id, sourcePage: 1,
                }],
                activeWorkspaceId: 'collapse-workspace-1', readerShare: 50, workspaceMode: 'note', noteZoom: 1, savedAt: now,
              }));
            });

            const response = await page.goto(`https://madness1997-gif.github.io/mednote-reader/?sidebar-collapse=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            if (!response || response.status() !== 200) throw new Error(`Live status ${response?.status()}`);

            const nav = page.locator('.mednote-page-sheet-nav');
            await nav.waitFor({ state: 'visible', timeout: 15000 });
            const close = nav.locator('[data-note-navigation-close]').first();
            await close.waitFor({ state: 'visible', timeout: 10000 });
            await close.click();
            await nav.waitFor({ state: 'hidden', timeout: 5000 });

            const restore = page.locator('[data-note-navigation-restore]').first();
            await restore.waitFor({ state: 'visible', timeout: 5000 });
            await restore.click();
            await nav.waitFor({ state: 'visible', timeout: 5000 });

            if (errors.length) throw new Error(`Browser errors: ${JSON.stringify(errors)}`);
            console.log('SIDEBAR_COLLAPSE_RESTORE_OK');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
