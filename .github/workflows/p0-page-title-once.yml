name: P0 Page title ownership

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0-page-title-once.yml'

permissions:
  contents: write

jobs:
  apply-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward main
        run: git pull --ff-only origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply P0 patch
        run: python scripts/apply-p0-page-title.py
      - name: Install dependencies
        run: npm ci
      - name: Validate P0
        run: |
          npm run typecheck
          npm run test:wave1
          npm run test:wave4
          npm run build:pages
          npx playwright install --with-deps chromium
          npx playwright test tests/note-hierarchy-actions.spec.cjs
      - name: Commit P0 to main
        run: |
          git config user.name 'ChatGPT P0'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/page-title-editor.tsx tests/note-hierarchy-actions.spec.cjs tests-unit/wave4.test.ts
          git diff --cached --check
          git commit -m 'Make Page.title the title source of truth'
          git push origin HEAD:main
