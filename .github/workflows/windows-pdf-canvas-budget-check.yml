name: Check Windows PDF Canvas Budget

on:
  push:
    branches:
      - agent/windows-pdf-canvas-budget

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Test LRU budget manager
        shell: pwsh
        run: |
          npx tsc app/desktop-pdf-canvas-budget.ts --target ES2022 --module ES2022 --moduleResolution Bundler --outDir .tmp-budget --skipLibCheck
          @'
          import { PdfCanvasBudgetManager } from './.tmp-budget/desktop-pdf-canvas-budget.js';
          import assert from 'node:assert/strict';

          const evicted = [];
          const manager = new PdfCanvasBudgetManager(100);
          manager.report('a', 60, () => evicted.push('a'));
          manager.report('b', 60, () => evicted.push('b'));
          assert.deepEqual(evicted, ['a']);
          assert.equal(manager.snapshot().totalBytes, 60);
          assert.deepEqual(manager.snapshot().entries.map((entry) => entry.key), ['b']);

          const pinnedEvicted = [];
          const pinned = new PdfCanvasBudgetManager(100);
          pinned.report('visible', 70, () => pinnedEvicted.push('visible'), () => true);
          pinned.report('warm', 40, () => pinnedEvicted.push('warm'));
          assert.deepEqual(pinnedEvicted, []);
          assert.equal(pinned.snapshot().totalBytes, 110);
          pinned.report('new', 30, () => pinnedEvicted.push('new'));
          assert.deepEqual(pinnedEvicted, ['warm']);
          assert.equal(pinned.snapshot().totalBytes, 100);
          assert.equal(pinned.snapshot().entries.some((entry) => entry.key === 'visible'), true);

          console.log('PDF_CANVAS_BUDGET_LRU_OK', JSON.stringify(manager.snapshot()));
          '@ | Set-Content -Encoding UTF8 .tmp-budget-test.mjs
          node .tmp-budget-test.mjs
      - name: Build desktop bundle
        run: npm run build:desktop
      - name: Verify desktop-only transform landed
        shell: pwsh
        run: |
          $matches = Get-ChildItem dist-electron -Recurse -File | Select-String -Pattern 'desktop-pdf-' -SimpleMatch
          if (-not $matches) { throw 'Desktop PDF canvas budget marker missing from built bundle' }
          Write-Host 'DESKTOP_PDF_CANVAS_TRANSFORM_OK'
      - name: Package Windows app
        run: npx electron-builder --win nsis --publish never
      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter 'MedNote-Reader-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer missing' }
          Write-Host "WINDOWS_INSTALLER_OK $($installer.FullName)"
