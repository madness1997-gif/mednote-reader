name: P9 cleanup composition

on:
  push:
    branches: [p9-ui-component-split]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'P9 cleaned composition source'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p9-ui-component-split
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/p9-cleanup.cjs
      - run: npm run typecheck
      - name: Commit cleanup
        run: |
          git config user.name "Dũng"
          git config user.email "61448424+madness1997-gif@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "P9 cleaned composition source"
          git push origin HEAD:p9-ui-component-split
