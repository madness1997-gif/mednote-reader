name: Check newer local lazy restore

on:
  push:
    branches: [agent/fix-lazy-local-restore]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:pages
        env:
          VITE_GOOGLE_CLIENT_ID: 647663227509-gcrelfm08dbli66ku94vjgpqj8fn9goi.apps.googleusercontent.com
      - run: npm run build:desktop
      - run: npm install --no-save --no-audit --no-fund @playwright/test@1.54.2
      - run: npx playwright install --with-deps chromium
      - name: Verify newer full local snapshot becomes lazy immediately
        run: |
          set -euo pipefail
          npx vite preview --config vite.github.config.ts --host 127.0.0.1 --port 4173 > /tmp/mednote-vite.log 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/mednote-reader/ >/dev/null && break || sleep 1
          done
          node - <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            const url = 'http://127.0.0.1:4173/mednote-reader/';
            const makeSnapshot = (body2, savedAt, title2 = 'Trang 2') => {
              const paper = { size: 'a4', orientation: 'portrait', template: 'blank', color: 'white' };
              const text = { font: 'times', size: 12, color: 'auto', bold: false, italic: false, underline: false, align: 'left' };
              const p1 = { id: 'p1', title: 'Trang 1', titleHtml: 'Trang 1', body: 'ACTIVE_CONTENT_1', bodyHtml: '<p>ACTIVE_CONTENT_1</p>', citationPage: null, strokes: [], excerpts: [], paper, text };
              const p2 = { id: 'p2', title: title2, titleHtml: title2, body: body2, bodyHtml: `<p>${body2}</p>`, citationPage: null, strokes: [], excerpts: [], paper, text };
              return {
                workspaces: [{ id: 'w1', kind: 'empty', name: 'Lazy restore', documents: [], activeDocumentId: null, notebooks: [{ id: 'n1', title: 'Lazy book', pages: [p1, p2], activePageId: 'p1', createdAt: savedAt }], activeNotebookId: 'n1', sourcePage: 1 }],
                activeWorkspaceId: 'w1', readerShare: 50, workspaceMode: 'note', noteZoom: 1, savedAt,
              };
            };

            await page.goto(url, { waitUntil: 'domcontentloaded' });
            await page.evaluate(snapshot => {
              localStorage.clear();
              localStorage.setItem('mednote-library-v2', JSON.stringify(snapshot));
              location.reload();
            }, makeSnapshot('OLD_LAZY_CONTENT_2', Date.now()));

            const waitLazy = async (expectedTitle) => {
              await page.waitForFunction(({ expectedTitle }) => {
                const state = window.__MEDNOTE_LIVE_STATE__;
                const ws = state?.workspaces?.find(item => item.id === 'w1');
                const book = ws?.notebooks?.find(item => item.id === 'n1');
                const p1 = book?.pages?.find(item => item.id === 'p1');
                const p2 = book?.pages?.find(item => item.id === 'p2');
                return state?.workspaceMode === 'note'
                  && book?.activePageId === 'p1'
                  && p1?.body === 'ACTIVE_CONTENT_1'
                  && p1?.__mednoteLazyPage !== true
                  && p2?.title === expectedTitle
                  && p2?.body === ''
                  && p2?.__mednoteLazyPage === true;
              }, { expectedTitle }, { timeout: 15000 });
            };

            await waitLazy('Trang 2');
            await page.waitForTimeout(800);

            const metaSavedAt = await page.evaluate(async () => {
              const db = await new Promise((resolve, reject) => {
                const r = indexedDB.open('mednote-local', 1);
                r.onsuccess = () => resolve(r.result);
                r.onerror = () => reject(r.error);
              });
              try {
                return await new Promise((resolve, reject) => {
                  const r = db.transaction('documents', 'readonly').objectStore('documents').get('library:v3:meta');
                  r.onsuccess = () => resolve(r.result?.savedAt || 0);
                  r.onerror = () => reject(r.error);
                });
              } finally { db.close(); }
            });
            if (!metaSavedAt) throw new Error('IndexedDB v4 metadata was not written');

            const newer = makeSnapshot('NEWER_LAZY_CONTENT_2', Number(metaSavedAt) + 10000, 'Trang 2 mới hơn');
            await page.evaluate(snapshot => {
              localStorage.setItem('mednote-library-v2', JSON.stringify(snapshot));
              location.reload();
            }, newer);

            await waitLazy('Trang 2 mới hơn');
            await page.evaluate(() => window.dispatchEvent(new CustomEvent('mednote:activate-note-page', { detail: 'p2' })));
            await page.waitForFunction(() => {
              const state = window.__MEDNOTE_LIVE_STATE__;
              const ws = state?.workspaces?.find(item => item.id === 'w1');
              const book = ws?.notebooks?.find(item => item.id === 'n1');
              const p2 = book?.pages?.find(item => item.id === 'p2');
              return book?.activePageId === 'p2'
                && p2?.__mednoteLazyPage !== true
                && p2?.body === 'NEWER_LAZY_CONTENT_2';
            }, null, { timeout: 10000 });
            const text = await page.locator('[data-note-page-id="p2"]').innerText();
            if (!text.includes('NEWER_LAZY_CONTENT_2')) throw new Error(`Hydrated newer page did not render: ${text}`);
            console.log('NEWER_LOCAL_SNAPSHOT_LAZY_RESTORE_OK');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE