name: Apply dormant First Aid transition patch

on:
  push:
    branches:
      - fix/fa-dormant-semantics

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Use First Aid template transition boundary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fa-dormant-semantics
      - name: Patch page template transition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/page.tsx')
          source = path.read_text()

          old_import = 'import { firstAidDocumentFromLegacy, firstAidDocumentPlainText, firstAidDocumentStandardRichText, normalizeFirstAidDocument } from "./first-aid-block-model";'
          new_import = 'import { firstAidDocumentFromLegacy, firstAidTemplateTransition, normalizeFirstAidDocument } from "./first-aid-block-model";'
          assert old_import in source, 'First Aid model import changed unexpectedly'
          source = source.replace(old_import, new_import, 1)

          pattern = re.compile(
              r'  const updatePaperTemplate = \(template: PaperTemplate\) => \{.*?'
              r'    setToast\("Đã áp dụng bố cục First Aid"\);\n'
              r'  \};',
              re.S,
          )
          replacement = '''  const updatePaperTemplate = (template: PaperTemplate) => {
            const currentTemplate = activeNote.paper.template;
            const transition = firstAidTemplateTransition({
              currentTemplate,
              nextTemplate: template,
              bodyHtml: activeNote.bodyHtml ?? "",
              body: activeNote.body,
              firstAid: activeNote.firstAid,
            });

            if (template !== "first-aid") {
              updateActiveNote({
                paper: { ...activeNote.paper, template },
                ...transition,
              });
              setToast(currentTemplate === "first-aid" ? "Đã chuyển nội dung First Aid về văn bản thường" : "Đã lưu mẫu giấy cho trang này");
              return;
            }

            updateActiveNote({
              paper: { ...activeNote.paper, size: "a4", orientation: "portrait", template: "first-aid", color: "white" },
              text: { ...activeNote.text, font: "times", size: 12, align: "left" },
              ...transition,
            });
            setActiveTool("text");
            setToast("Đã áp dụng bố cục First Aid");
          };'''
          source, count = pattern.subn(replacement, source, count=1)
          assert count == 1, f'expected one updatePaperTemplate handler, replaced {count}'
          path.write_text(source)

          workflow = Path('.github/workflows/fa-dormant-patch.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit transition patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/fa-dormant-patch.yml
          git commit -m "Use First Aid template transition boundary"
          git push origin HEAD:fix/fa-dormant-semantics
