name: Validate dormant First Aid semantics

on:
  push:
    branches:
      - fix/fa-dormant-semantics

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm run test:unit
      - name: Browser regression suite
        run: |
          npx playwright install --with-deps chromium
          npm run test:all
      - name: Build web and desktop
        run: |
          npm run build:pages
          npm run build:desktop
