name: P6.5 P5 ownership test fix

on:
  push:
    branches:
      - p6.5-stabilize-library

permissions:
  contents: write

jobs:
  patch-test:
    if: ${{ !contains(github.event.head_commit.message, '[p65-testbot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p6.5-stabilize-library
          fetch-depth: 0
      - name: Replace detached-workspace ownership assertion
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('tests-unit/document-library-controller.test.ts')
          text = path.read_text()
          old = '''    assert.equal(result.workspaces[0].kind, "empty");\n    assert.equal(result.workspaces[0].noteNotebookId, "nb");\n    assert.equal((await context.repository.loadDocumentGraph())?.documents.length, 0);\n'''
          new = '''    assert.equal(result.workspaces.some((workspace) => workspace.id === "note-runtime-v6"), true);\n    const structure = await context.repository.loadNoteStructure();\n    assert.equal(structure?.notebooks.some((notebook) => notebook.id === "nb"), true);\n    assert.equal((await context.repository.loadDocumentGraph())?.documents.length, 0);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one detached-workspace assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/p65-p5-test-fix.yml').unlink()
          PY
      - name: Commit ownership assertion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests-unit/document-library-controller.test.ts .github/workflows/p65-p5-test-fix.yml
          git commit -m "P6.5 assert NoteStructure owns notes [p65-testbot]"
          git push origin HEAD:p6.5-stabilize-library
