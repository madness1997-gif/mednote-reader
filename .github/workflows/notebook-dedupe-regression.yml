name: Notebook Dedupe Regression
on:
  push:
    branches:
      - fix/dedupe-existing-notebook-names-20260812
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/notebook-existing-duplicate-repair.spec.cjs tests/note-hierarchy-actions.spec.cjs
      - run: npm run build:desktop
