name: P7 final gate
on:
  push:
    branches: [p7-pdf-runtime]
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p7-pdf-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Boundary audit
        shell: bash
        run: |
          ! grep -nE 'loadPdfDocument|loadPdfiumDocument|PDFDocument\.load|getTextContent\(' app/page.tsx
          ! grep -R -nE 'pdf-wheel-zoom-runtime|pdf-search-toolbar-runtime' src app
          test ! -e app/pdf-wheel-zoom-runtime.ts
          test ! -e app/pdf-search-toolbar-runtime.ts
          grep -q 'from "./pdf-domain"' app/pdf-reader.tsx
          grep -q 'from "./pdf-domain"' app/document-runtime-adapter.ts
          grep -q '"test:p7"' package.json
          test ! -e scripts/p7-pretypecheck.cjs
      - name: Typecheck
        run: npm run typecheck
      - name: P3 gate
        run: npm run test:p3
      - name: P4 gate
        run: npm run test:p4
      - name: P5 gate
        run: npm run test:p5
      - name: P6 gate
        run: npm run test:p6
      - name: P6.5 gate
        run: npm run test:p65
      - name: P7 gate
        run: npm run test:p7
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright gate
        run: npm run test:all
      - name: Web build
        run: npm run build:pages
      - name: Desktop build
        run: npm run build:desktop
      - name: Remove final gate workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/p7-final-gate.yml
          git add .github/workflows/p7-final-gate.yml
          git commit -m "P7 remove final validation workflow [p7-gate]"
          git push origin HEAD:p7-pdf-runtime
