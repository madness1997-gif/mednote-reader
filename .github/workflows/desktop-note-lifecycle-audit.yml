name: Note Lifecycle Audit

on:
  push:
    branches:
      - audit/desktop-note-lifecycle-20260812

permissions:
  contents: read

jobs:
  note-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/note-sheet-delete-active.spec.cjs tests/note-hierarchy-actions.spec.cjs --project=chromium
      - run: npm run build:desktop
      - run: xvfb-run -a node tests/electron-note-hierarchy-crud-audit.cjs
