name: P6.5 Library patch

on:
  push:
    branches:
      - p6.5-stabilize-library

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[p65-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p6.5-stabilize-library
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch canonical Library UI and regressions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { documentLibrary, type DocumentMutationResult } from "./document-library-controller";\n',
              'import { documentLibrary, type DocumentMutationResult } from "./document-library-controller";\nimport { projectLibrary } from "./library-projection";\n',
              'library projection import',
          )
          replace_once(
              '  DEFAULT_READER, createDemoWorkspace, createEmptyWorkspace, documentRuntimeWorkspace,\n  isReaderPlaceholder, normalizeReader, type ReaderState,\n',
              '  DEFAULT_READER, NOTE_RUNTIME_WORKSPACE_ID, createDemoWorkspace, createEmptyWorkspace, documentRuntimeWorkspace,\n  isReaderPlaceholder, normalizeReader, type ReaderState,\n',
              'note runtime import',
          )
          replace_once(
              '''  const hasActiveNote = Boolean(noteState.structure?.active.activeSheetId)\n    && (activeWorkspace.kind === "empty" || activeWorkspace.kind === "demo"\n      || Boolean(activeWorkspace.noteNotebookId && noteState.structure?.notebooks.some((notebook) => notebook.id === activeWorkspace.noteNotebookId)));\n  const selectedExcerptIndex = activeNote.excerpts.findIndex((excerpt) => excerpt.id === selectedExcerptId);\n''',
              '''  const hasActiveNote = Boolean(noteState.structure?.active.activeSheetId);\n  const selectedExcerptIndex = activeNote.excerpts.findIndex((excerpt) => excerpt.id === selectedExcerptId);\n''',
              'hasActiveNote',
          )
          replace_once(
              '''\n  useEffect(() => {\n    const notebookId = activeWorkspace.noteNotebookId;\n    const structure = noteStore.getSnapshot().structure;\n    if (!notebookId || !structure?.notebooks.some((notebook) => notebook.id === notebookId)\n      || structure.active.activeNotebookId === notebookId) return;\n    void noteStore.openNotebook(notebookId).catch(() => undefined);\n  }, [activeWorkspace.id, activeWorkspace.noteNotebookId, noteState.status]);\n''',
              '\n',
              'document auto-opens linked notebook effect',
          )
          active_doc = '  const activeDocument = activeWorkspace.documents.find((document) => document.id === activeWorkspace.activeDocumentId) ?? activeWorkspace.documents[0] ?? null;\n'
          replace_once(
              active_doc,
              active_doc + '''  const libraryProjection = useMemo(() => noteState.structure\n    ? projectLibrary(noteState.structure, noteState.documents)\n    : { notes: [], documents: [] }, [noteState.documents, noteState.structure]);\n  const activeWorkspaceLinkedNotebookIds = activeWorkspace.kind === "temporary"\n    ? activeWorkspace.noteNotebookId ? [activeWorkspace.noteNotebookId] : []\n    : libraryProjection.documents.find((item) => item.id === activeWorkspace.id)?.linkedNotebookIds || [];\n  const activeWorkspaceHasLinkedNote = activeWorkspaceLinkedNotebookIds.length > 0;\n''',
              'library projection state',
          )
          replace_once(
              '''      } else {\n        updateActiveWorkspace((workspace) => ({ ...workspace, noteNotebookId: result.active.activeNotebookId }));\n      }\n''',
              '''      } else {\n        const noteRuntime = workspacesRef.current.find((workspace) => workspace.id === NOTE_RUNTIME_WORKSPACE_ID);\n        if (noteRuntime && activeWorkspaceIdRef.current !== noteRuntime.id) {\n          activeWorkspaceIdRef.current = noteRuntime.id;\n          setActiveWorkspaceId(noteRuntime.id);\n        }\n      }\n''',
              'note-only notebook creation',
          )
          begin_rename = '  const beginWorkspaceRename = (workspace: WorkspaceItem) => {\n'
          replace_once(
              begin_rename,
              '''  const openLibraryNotebook = async (notebookId: string) => {\n    try {\n      await noteStore.openNotebook(notebookId);\n      const noteRuntime = workspacesRef.current.find((workspace) => workspace.id === NOTE_RUNTIME_WORKSPACE_ID);\n      if (noteRuntime) {\n        activeWorkspaceIdRef.current = noteRuntime.id;\n        setActiveWorkspaceId(noteRuntime.id);\n      }\n      workspaceModeRef.current = "note";\n      setWorkspaceMode("note");\n      setLibraryOpen(false);\n    } catch (error) {\n      setToast(error instanceof Error ? error.message : "Không thể mở Notebook");\n    }\n  };\n\n''' + begin_rename,
              'open notebook from Library',
          )
          replace_once(
              '''    const linkedNotebook = noteState.structure?.notebooks.find((notebook) => notebook.id === target.noteNotebookId);\n    const targetLabel = target.kind === "collection" ? "cụm tài liệu" : target.kind === "demo" ? "tài liệu mẫu" : "tài liệu";\n    if (!window.confirm(`Xóa ${targetLabel} “${target.name}”? ${linkedNotebook ? "Mọi note sẽ được giữ lại thành note độc lập." : "Thao tác này chỉ xóa bản PDF đã lưu."}`)) return;\n''',
              '''    const linkedNotebookCount = target.kind === "temporary"\n      ? target.noteNotebookId ? 1 : 0\n      : libraryProjection.documents.find((item) => item.id === target.id)?.linkedNotebookIds.length || 0;\n    const targetLabel = target.kind === "collection" ? "cụm tài liệu" : target.kind === "demo" ? "tài liệu mẫu" : "tài liệu";\n    if (!window.confirm(`Xóa ${targetLabel} “${target.name}”? ${linkedNotebookCount ? `Các Notebook đang liên kết (${linkedNotebookCount}) vẫn được giữ nguyên trong Ghi chú.` : "Thao tác này chỉ xóa bản PDF đã lưu."}`)) return;\n''',
              'delete confirmation',
          )
          replace_once(
              '          {activeWorkspace.documents.length > 0 && !hasActiveNote && <button className="save-session-button" onClick={() => { void addNotebook(); }}><NotebookTabs size={15} /> Tạo note</button>}\n',
              '          {activeWorkspace.documents.length > 0 && !activeWorkspaceHasLinkedNote && <button className="save-session-button" onClick={() => { void addNotebook(); }}><NotebookTabs size={15} /> Tạo note</button>}\n',
              'document create-note button',
          )

          start_marker = '            <div className="library-list">\n'
          end_marker = '            </div>\n          </aside>\n        </div>\n      )}'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('library list start not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('library list end not found')
          new_library = '''            <div className="library-list">\n              <section className="library-domain" aria-label="Ghi chú">\n                <div className="library-domain-heading"><div><strong>Ghi chú</strong><span>{libraryProjection.notes.length} Notebook</span></div><small>Nguồn: NoteStructure</small></div>\n                {libraryProjection.notes.length ? libraryProjection.notes.map((notebook) => (\n                  <div className="library-row library-row-single" key={`note:${notebook.id}`}>\n                    <button className={`library-item ${noteState.structure?.active.activeNotebookId === notebook.id ? "active" : ""}`} onClick={() => { void openLibraryNotebook(notebook.id); }}>\n                      <span className="library-icon"><NotebookTabs size={19} /></span>\n                      <span><strong>{notebook.title}</strong><small>{notebook.sectionCount} section · {notebook.pageCount} page · {notebook.sheetCount} sheet{notebook.linkedDocuments.length ? ` · ${notebook.linkedDocuments.length} PDF liên kết` : " · độc lập"}</small></span>\n                    </button>\n                  </div>\n                )) : <div className="library-domain-empty">Chưa có Notebook.</div>}\n              </section>\n\n              <section className="library-domain" aria-label="Tài liệu">\n                <div className="library-domain-heading"><div><strong>Tài liệu</strong><span>{libraryProjection.documents.length} mục</span></div><small>Nguồn: DocumentGraph</small></div>\n                {libraryProjection.documents.length ? libraryProjection.documents.map((item) => {\n                  const workspace = workspaces.find((candidate) => candidate.id === item.id);\n                  const isRenaming = renamingWorkspaceId === item.id;\n                  return (\n                    <div className="library-row" key={`document:${item.id}`}>\n                      {isRenaming && workspace ? (\n                        <form className={`library-item library-rename-item ${item.id === activeWorkspace.id ? "active" : ""}`} onSubmit={(event) => { event.preventDefault(); commitWorkspaceRename(item.id); }}>\n                          <span className="library-icon"><FileText size={19} /></span>\n                          <span><input autoFocus value={renamingWorkspaceName} onChange={(event) => setRenamingWorkspaceName(event.target.value)} onFocus={(event) => event.currentTarget.select()} onKeyDown={(event) => { if (event.key === "Escape") cancelWorkspaceRename(); }} aria-label="Tên tài liệu mới" /><small>Enter để lưu · Esc để hủy</small></span>\n                        </form>\n                      ) : (\n                        <button className={`library-item ${item.id === activeWorkspace.id ? "active" : ""}`} disabled={!workspace} onClick={() => {\n                          if (!workspace) return setToast("Document runtime chưa sẵn sàng");\n                          activeWorkspaceIdRef.current = item.id;\n                          setActiveWorkspaceId(item.id);\n                          workspaceModeRef.current = "reader";\n                          setWorkspaceMode("reader");\n                          setLibraryOpen(false);\n                        }}>\n                          <span className="library-icon"><FileText size={19} /></span>\n                          <span><strong>{item.name}</strong><small>{item.kind === "collection" ? `${item.documents.length} tài liệu` : "1 tài liệu"} · {item.linkedNotebookIds.length ? `${item.linkedNotebookIds.length} Notebook liên kết` : "không liên kết note"}</small></span>\n                        </button>\n                      )}\n                      {workspace && (isRenaming\n                        ? <><button className="library-action library-save" onClick={() => commitWorkspaceRename(item.id)} aria-label="Lưu tên mới" title="Lưu tên mới"><Check size={17} /></button><button className="library-action library-cancel" onClick={cancelWorkspaceRename} aria-label="Hủy đổi tên" title="Hủy"><X size={17} /></button></>\n                        : <><button className="library-action library-rename" onClick={() => beginWorkspaceRename(workspace)} aria-label={`Đổi tên ${item.name}`} title="Đổi tên tài liệu"><Pencil size={17} /></button><button className="library-action library-delete" onClick={() => { void deleteWorkspace(item.id); }} aria-label={`Xóa ${item.name}`} title="Xóa PDF; giữ nguyên NoteStructure"><Trash2 size={17} /></button></>)}\n                    </div>\n                  );\n                }) : <div className="library-domain-empty">Chưa có PDF đã lưu. PDF tạm không xuất hiện ở đây.</div>}\n              </section>\n            </div>\n'''
          text = text[:start] + new_library + text[end + len('            </div>\n'):]
          path.write_text(text)

          css = Path('app/globals.css')
          css_text = css.read_text()
          marker = '/* P6.5 canonical Library domains */'
          if marker not in css_text:
              css.write_text(css_text + '''\n\n/* P6.5 canonical Library domains */\n.library-domain + .library-domain { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border, #d8e1e5); }\n.library-domain-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 4px 8px; }\n.library-domain-heading > div { display: flex; align-items: baseline; gap: 8px; }\n.library-domain-heading strong { font-size: 13px; letter-spacing: .01em; }\n.library-domain-heading span, .library-domain-heading small, .library-domain-empty { color: #6c7b82; font-size: 12px; }\n.library-domain-empty { padding: 14px 10px; }\n''')

          test_path = Path('tests-unit/library-projection.test.ts')
          test_path.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\n\nimport { projectLibrary, linkedNotebookIdsForDocuments } from "../app/library-projection";\nimport { NOTE_RUNTIME_WORKSPACE_ID, runtimeWorkspacesFromDocumentGraph } from "../app/document-runtime-adapter";\nimport type { DocumentGraph } from "../app/document-domain";\nimport type { NoteStructure } from "../app/note-domain";\n\nfunction fixture() {\n  const notebooks = Array.from({ length: 5 }, (_, index) => ({ id: `nb-${index + 1}`, title: `Notebook ${index + 1}`, order: index }));\n  const sections = notebooks.map((notebook, index) => ({ id: `sec-${index + 1}`, notebookId: notebook.id, title: `Section ${index + 1}`, order: 0 }));\n  const pages = sections.map((section, index) => ({ id: `page-${index + 1}`, sectionId: section.id, title: `Page ${index + 1}`, order: 0 }));\n  const sheets = pages.map((page, index) => ({ id: `sheet-${index + 1}`, pageId: page.id, order: 0 }));\n  const structure: NoteStructure = {\n    workspace: { id: "workspace", title: "MedNote" }, notebooks, sections, pages, sheets,\n    active: { activeNotebookId: "nb-5", activeSectionId: "sec-5", activePageId: "page-5", activeSheetId: "sheet-5" },\n  };\n  const graph: DocumentGraph = {\n    documents: [\n      { id: "doc-1", name: "One.pdf", size: 10, lastModified: 1, available: true, payload: {} },\n      { id: "doc-2", name: "Two.pdf", size: 20, lastModified: 2, available: true, payload: {} },\n      { id: "temp-doc", name: "Temp.pdf", size: 1, lastModified: 3, available: true, payload: {} },\n    ],\n    contexts: [\n      { id: "ctx-1", kind: "document", name: "One", documentIds: ["doc-1"], activeDocumentId: "doc-1", sourcePage: 1 },\n      { id: "ctx-2", kind: "document", name: "Two", documentIds: ["doc-2"], activeDocumentId: "doc-2", sourcePage: 2 },\n      { id: "temp-ctx", kind: "temporary", name: "Temp", documentIds: ["temp-doc"], activeDocumentId: "temp-doc", sourcePage: 1 },\n    ],\n    groups: [],\n    links: [\n      { id: "link-1", documentId: "doc-1", targetType: "page", targetId: "page-1" },\n      { id: "link-2", documentId: "doc-2", targetType: "sheet", targetId: "sheet-2" },\n      { id: "link-3", documentId: "doc-1", targetType: "sheet", targetId: "sheet-2" },\n    ],\n    linkRelations: [],\n  };\n  return { structure, graph };\n}\n\ntest("Library notes are a total projection of NoteStructure while documents exclude temporary contexts", () => {\n  const { structure, graph } = fixture();\n  const projected = projectLibrary(structure, graph);\n  assert.equal(projected.notes.length, structure.notebooks.length);\n  assert.deepEqual(projected.notes.map((item) => item.id), ["nb-1", "nb-2", "nb-3", "nb-4", "nb-5"]);\n  assert.equal(projected.documents.length, 2);\n  assert.equal(projected.documents.some((item) => item.id === "temp-ctx"), false);\n  assert.deepEqual(projected.notes.find((item) => item.id === "nb-1")?.linkedDocumentIds, ["doc-1"]);\n  assert.deepEqual(projected.notes.find((item) => item.id === "nb-2")?.linkedDocumentIds, ["doc-2", "doc-1"]);\n  assert.equal(projected.notes.find((item) => item.id === "nb-5")?.linkedDocumentIds.length, 0);\n});\n\ntest("one document resolves every linked Notebook instead of first-link ownership", () => {\n  const { structure, graph } = fixture();\n  assert.deepEqual(linkedNotebookIdsForDocuments(graph, structure, ["doc-1"]), ["nb-1", "nb-2"]);\n  assert.deepEqual(projectLibrary(structure, graph).documents.find((item) => item.id === "ctx-1")?.linkedNotebookIds, ["nb-1", "nb-2"]);\n});\n\ntest("unlink and PDF deletion never remove canonical notebooks", () => {\n  const { structure, graph } = fixture();\n  const unlinked = { ...graph, links: graph.links.filter((link) => link.documentId !== "doc-1") };\n  assert.equal(projectLibrary(structure, unlinked).notes.length, 5);\n  const deleted: DocumentGraph = {\n    ...graph,\n    documents: graph.documents.filter((document) => document.id !== "doc-1"),\n    contexts: graph.contexts.filter((context) => context.id !== "ctx-1"),\n    links: graph.links.filter((link) => link.documentId !== "doc-1"),\n  };\n  assert.equal(projectLibrary(structure, deleted).notes.length, 5);\n  assert.deepEqual(projectLibrary(structure, deleted).notes.map((item) => item.id), structure.notebooks.map((item) => item.id));\n});\n\ntest("runtime is document projection plus one stable note shell, never one workspace per Notebook", () => {\n  const { structure, graph } = fixture();\n  const runtime = runtimeWorkspacesFromDocumentGraph(graph, structure);\n  assert.equal(runtime.filter((workspace) => workspace.id === NOTE_RUNTIME_WORKSPACE_ID).length, 1);\n  assert.equal(runtime.length, 3);\n  assert.equal(runtime.some((workspace) => workspace.id === "temp-ctx"), false);\n  assert.equal(runtime.filter((workspace) => workspace.documents.length === 0).length, 1);\n});\n\ntest("create A then B remains a two-Notebook canonical Library independent of runtime ownership", () => {\n  const { structure, graph } = fixture();\n  const two = { ...structure, notebooks: structure.notebooks.slice(0, 2), sections: structure.sections.slice(0, 2), pages: structure.pages.slice(0, 2), sheets: structure.sheets.slice(0, 2) };\n  const projected = projectLibrary(two, { ...graph, links: [] });\n  assert.deepEqual(projected.notes.map((item) => item.id), ["nb-1", "nb-2"]);\n});\n''')

          drive_path = Path('tests-unit/drive-sync-service.test.ts')
          drive_text = drive_path.read_text()
          drive_marker = 'P6.5 preserves five notebooks and canonical hashes across web to desktop v2 restore'
          if drive_marker not in drive_text:
              drive_path.write_text(drive_text + '''\n\ntest("P6.5 preserves five notebooks and canonical hashes across web to desktop v2 restore", async () => {\n  const seed = library({ body: "seed" });\n  seed.notes.notebooks = Array.from({ length: 5 }, (_, index) => ({ id: `nb-${index + 1}`, title: `Notebook ${index + 1}`, order: index }));\n  seed.notes.sections = seed.notes.notebooks.map((notebook, index) => ({ id: `sec-${index + 1}`, notebookId: notebook.id, title: `Section ${index + 1}`, order: 0 }));\n  seed.notes.pages = seed.notes.sections.map((section, index) => ({ id: `page-${index + 1}`, sectionId: section.id, title: `Page ${index + 1}`, order: 0 }));\n  seed.notes.sheets = seed.notes.pages.map((page, index) => ({ id: `sheet-${index + 1}`, pageId: page.id, order: 0 }));\n  seed.notes.active = { activeNotebookId: "nb-5", activeSectionId: "sec-5", activePageId: "page-5", activeSheetId: "sheet-5" };\n  seed.sheetContents = Object.fromEntries(seed.notes.sheets.map((sheet, index) => [sheet.id, { body: `content-${index + 1}` }]));\n  seed.documents.documents = [\n    { id: "doc-one", name: "One.pdf", size: 3, lastModified: 1, available: true, payload: { reader: { ...DEFAULT_READER, page: 11 } } },\n    { id: "doc-two", name: "Two.pdf", size: 3, lastModified: 2, available: true, payload: { reader: { ...DEFAULT_READER, page: 22 } } },\n  ];\n  seed.documents.contexts = [\n    { id: "ctx-one", kind: "document", name: "One", documentIds: ["doc-one"], activeDocumentId: "doc-one", sourcePage: 11 },\n    { id: "ctx-two", kind: "document", name: "Two", documentIds: ["doc-two"], activeDocumentId: "doc-two", sourcePage: 22 },\n  ];\n  seed.documents.groups = [];\n  seed.documents.links = [\n    { id: "link-one", documentId: "doc-one", targetType: "page", targetId: "page-1" },\n    { id: "link-two", documentId: "doc-two", targetType: "sheet", targetId: "sheet-2" },\n  ];\n  seed.documents.linkRelations = [\n    { id: "relation-one", linkIds: ["link-one"], kind: "workspace", sourceType: "document", sourceId: "doc-one", createdAt: 1, updatedAt: 1 },\n    { id: "relation-two", linkIds: ["link-two"], kind: "workspace", sourceType: "document", sourceId: "doc-two", createdAt: 1, updatedAt: 1 },\n  ];\n  seed.preferences.activeDocumentContextId = "ctx-one";\n\n  const expected = createDriveBackup(seed);\n  const remote = new MemoryDrive();\n  const web = await harness(seed, remote);\n  const desktop = await harness(library({ body: "old desktop" }), remote);\n  try {\n    web.pdfs.set("doc-one", { name: "One.pdf", blob: new Blob(["one"], { type: "application/pdf" }) });\n    web.pdfs.set("doc-two", { name: "Two.pdf", blob: new Blob(["two"], { type: "application/pdf" }) });\n    await web.service.sync("web-token", web.snapshot);\n    const restored = await desktop.service.restore("desktop-token");\n    const actual = await desktop.notes.exportLibrary();\n    const actualBackup = createDriveBackup(actual);\n    assert.equal(restored.sourceVersion, "v2");\n    assert.equal(actual.notes.notebooks.length, 5);\n    assert.deepEqual(actual.notes.notebooks.map((item) => item.id).sort(), seed.notes.notebooks.map((item) => item.id).sort());\n    assert.deepEqual(actual.documents.documents.map((item) => item.id).sort(), ["doc-one", "doc-two"]);\n    assert.deepEqual(actual.documents.links.map((item) => item.id).sort(), ["link-one", "link-two"]);\n    assert.deepEqual(actualBackup.sheetContentHashes, expected.sheetContentHashes);\n    assert.equal(restored.snapshot.workspaces.filter((workspace) => workspace.id === "note-runtime-v6").length, 1);\n  } finally {\n    await web.close();\n    await desktop.close();\n  }\n});\n''')

          Path('.github/workflows/p65-library-patch.yml').unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: P6.5 projection tests
        run: npx tsx --test tests-unit/library-projection.test.ts

      - name: P4-P6.5 regression tests
        run: |
          npm run test:p4
          npm run test:p5
          npm run test:p6

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css tests-unit/library-projection.test.ts tests-unit/drive-sync-service.test.ts .github/workflows/p65-library-patch.yml
          git commit -m "P6.5 wire canonical Library UI [p65-bot]"
          git push origin HEAD:p6.5-stabilize-library
