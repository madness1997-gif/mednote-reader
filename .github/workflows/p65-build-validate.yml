name: P6.5 build validate

on:
  push:
    branches:
      - p6.5-stabilize-library

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[p65-buildbot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p6.5-stabilize-library
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:pages
      - run: npm run build:desktop
      - name: Remove validation workflow
        run: |
          rm .github/workflows/p65-build-validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/p65-build-validate.yml
          git commit -m "P6.5 complete build validation [p65-buildbot]"
          git push origin HEAD:p6.5-stabilize-library
