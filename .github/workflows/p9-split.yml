name: P9 split UI

on:
  push:
    branches: [p9-ui-component-split]

permissions:
  contents: write

jobs:
  split:
    if: github.event.head_commit.message != 'P9 generated UI split'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p9-ui-component-split
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          node scripts/p9-split.cjs
          node scripts/p9-fix.cjs
          node scripts/p9-fix2.cjs
      - run: npm run typecheck
      - name: Commit generated source
        run: |
          git config user.name "Dũng"
          git config user.email "61448424+madness1997-gif@users.noreply.github.com"
          git add app vite.github.config.ts vite.desktop.config.ts vite.workspace-suspension.ts vite.thumbnail-virtualization.ts
          git commit -m "P9 generated UI split"
          git push origin HEAD:p9-ui-component-split
