name: P8 source refactor

on:
  push:
    branches: [p8-note-editor-engine]

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message != 'P8 generated source refactor'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p8-note-editor-engine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply P8 source migration
        run: node scripts/p8-refactor.cjs
      - name: Typecheck generated source
        run: npm run typecheck
      - name: Commit generated refactor
        run: |
          git config user.name "Dũng"
          git config user.email "61448424+madness1997-gif@users.noreply.github.com"
          git add app src vite.github.config.ts vite.desktop.config.ts
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "P8 generated source refactor"
            git push origin HEAD:p8-note-editor-engine
          fi
