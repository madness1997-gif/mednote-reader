name: P7 cleanup
on:
  push:
    branches: [p7-pdf-runtime]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[p7-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p7-pdf-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean temporary hooks and tighten lifecycle tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('package.json'); t=p.read_text(); t=t.replace('    "pretypecheck": "node scripts/p7-pretypecheck.cjs",\n',''); p.write_text(t)

          p=Path('app/pdf-reader-controller.ts'); t=p.read_text()
          old='''  async open(input: { documentId: string; lastModified: number; blob: Blob }): Promise<PdfReaderSession | null> {\n    const generation = ++this.generation;\n    this.status = "loading";\n    this.error = null;\n    this.emit();\n    const bytes = new Uint8Array(await input.blob.arrayBuffer());\n'''
          new='''  async open(input: { documentId: string; lastModified: number; blob: Blob }): Promise<PdfReaderSession | null> {\n    const generation = ++this.generation;\n    const previous = this.session;\n    this.session = null;\n    this.status = "loading";\n    this.error = null;\n    this.emit();\n    if (previous) await Promise.allSettled([previous.pdf.destroy(), previous.pdfium?.destroy?.()]);\n    const bytes = new Uint8Array(await input.blob.arrayBuffer());\n    if (generation !== this.generation) return null;\n'''
          if old not in t: raise SystemExit('open lifecycle anchor missing')
          t=t.replace(old,new,1)
          old2='''    const previous = this.session;\n    const session: PdfReaderSession = {\n'''
          if old2 not in t: raise SystemExit('previous late anchor missing')
          t=t.replace(old2,'    const session: PdfReaderSession = {\n',1)
          old3='''\n    if (previous && previous.pdf !== pdf) {\n      await Promise.allSettled([previous.pdf.destroy(), previous.pdfium?.destroy?.()]);\n    }\n'''
          if old3 not in t: raise SystemExit('previous dispose block missing')
          t=t.replace(old3,'\n',1)
          p.write_text(t)

          p=Path('tests-unit/pdf-reader-controller.test.ts'); t=p.read_text()
          marker='''test("search works across targets, cancellation stops it, temporary proxy is destroyed", async () => {\n'''
          extra='''test("collection search scans multiple bounded targets", async () => {\n  const one = proxy("one");\n  const two = proxy("two");\n  const controller = new PdfReaderController({ loadPdf: async (source: any) => source.size === 1 ? one : two, loadPdfium: async () => { throw new Error("skip"); } });\n  const results = await controller.search("diabetes", [\n    { id: "one", name: "One", lastModified: 1, proxy: one },\n    { id: "two", name: "Two", lastModified: 2, proxy: two },\n  ], { concurrency: 2 });\n  assert.deepEqual(results.map((item) => item.documentId).sort(), ["one", "two"]);\n});\n\n'''
          if extra not in t:
            if marker not in t: raise SystemExit('search marker missing')
            t=t.replace(marker,extra+marker,1)
          p.write_text(t)
          PY
          rm -f scripts/p7-pretypecheck.cjs P7_HOME_RETRY.txt P7_HOME_RETRY_2.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:p7
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/p7-cleanup.yml
          git add -A
          git commit -m "P7 finalize PDF runtime lifecycle [p7-clean]"
          git push origin HEAD:p7-pdf-runtime
