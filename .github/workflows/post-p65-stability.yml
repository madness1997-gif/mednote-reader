name: Post P6.5 Stability

on:
  push:
    branches:
      - agent/post-p65-stability

permissions:
  contents: write

jobs:
  stabilize:
    if: ${{ !contains(github.event.head_commit.message, '[post-p65-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply stabilization patch
        run: python3 .github/post-p65-stability.py

      - name: Typecheck
        run: npm run typecheck

      - name: Bootstrap regressions
        run: npm run test:p4

      - name: Document controller regressions
        run: npm run test:p5

      - name: Drive regressions
        run: npm run test:p6

      - name: Library projection regressions
        run: npm run test:p65

      - name: Build web
        run: npm run build:pages

      - name: Build desktop renderer
        run: npm run build:desktop

      - name: Commit validated stabilization
        run: |
          rm -f .github/post-p65-stability.py .github/workflows/post-p65-stability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/document-library-controller.ts app/drive-sync-service.ts tests-unit/document-library-controller.test.ts tests-unit/drive-sync-service.test.ts .github
          git diff --cached --quiet && exit 0
          git commit -m "Stabilize P6.5 runtime links and Drive active state [post-p65-bot]"
          git push origin HEAD:agent/post-p65-stability
