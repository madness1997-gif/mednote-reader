name: P7 diagnostics
on:
  push:
    branches: [p7-pdf-runtime]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p7-pdf-runtime
      - name: Relevant page snippets
        shell: bash
        run: |
          set +e
          echo '=== IMPORTS ==='; sed -n '1,150p' app/page.tsx
          echo '=== PDF SOURCE/LOAD ==='; grep -n -B8 -A55 'let highFidelityDocument' app/page.tsx
          echo '=== OUTLINE ==='; grep -n -B15 -A70 'getOutline' app/page.tsx
          echo '=== SEARCH ==='; grep -n -B20 -A90 'getTextContent' app/page.tsx
          echo '=== ANNOTATIONS ==='; grep -n -B10 -A120 'const commitPdfAnnotations' app/page.tsx
          echo '=== EXPORT ==='; grep -n -B20 -A220 'PDFDocument.load' app/page.tsx
          echo '=== DOCUMENT STAGE ==='; grep -n -B10 -A35 'className="document-stage' app/page.tsx
          echo '=== ZOOM CONTROL ==='; grep -n -B10 -A35 'zoom-control' app/page.tsx | head -120
          echo '=== RUNTIME SHIMS ==='; grep -R -n 'pdf-search-toolbar-runtime\|pdf-wheel-zoom-runtime' app src || true
