name: Build Windows 1.2.6

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-windows-1.2.6.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/build-windows-trigger-1.2.6.txt

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        shell: pwsh
        run: npm run dist:win

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "release/MedNote-Reader-Setup-1.2.6.exe"
          if (-not (Test-Path $installer)) {
            Write-Host "Release directory contents:"
            Get-ChildItem -Recurse release -ErrorAction SilentlyContinue
            throw "Installer was not created: $installer"
          }
          Get-Item $installer | Format-List Name, Length, LastWriteTime

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedNote-Reader-Windows-1.2.6
          path: release/MedNote-Reader-Setup-1.2.6.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.6
          name: MedNote Reader 1.2.6
          body: |
            Windows x64 installer for MedNote Reader 1.2.6.

            Download `MedNote-Reader-Setup-1.2.6.exe` and run it to install.
          files: release/MedNote-Reader-Setup-1.2.6.exe
          fail_on_unmatched_files: true
          overwrite_files: true
