name: Publish MedNote Reader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify normalized note domain and repository
        run: |
          npm run typecheck
          npm run test:wave1
      - run: npm run build:pages
        env:
          VITE_GOOGLE_CLIENT_ID: 647663227509-gcrelfm08dbli66ku94vjgpqj8fn9goi.apps.googleusercontent.com
      - name: Stamp deployment version
        run: echo "${GITHUB_SHA}" > pages-dist/deploy-version.txt
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}
          timeout: 600000

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live version
        run: |
          set -euo pipefail
          url="https://madness1997-gif.github.io/mednote-reader/deploy-version.txt"
          for i in $(seq 1 60); do
            live=$(curl -fsSL "${url}?v=${GITHUB_SHA}-${i}" || true)
            if [ "${live}" = "${GITHUB_SHA}" ]; then
              echo "Verified live commit ${GITHUB_SHA}"
              exit 0
            fi
            sleep 5
          done
          echo "Live site did not refresh to ${GITHUB_SHA}"
          exit 1
      - name: Install live browser verifier
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.54.2
          npx playwright install --with-deps chromium
      - name: Verify sidebar and lazy notes on production after IndexedDB-only reload
        run: |
          node - <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 980, height: 1500 },
              hasTouch: true,
              isMobile: false,
            });
            const page = await context.newPage();
            const errors = [];
            page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
            page.on('pageerror', err => errors.push(`pageerror: ${err.message}`));

            await page.addInitScript(() => {
              // Seed exactly once. After the first production load, force the
              // current persisted shape: IndexedDB owns note content while
              // localStorage contains only a tiny storage marker.
              if (sessionStorage.getItem('live-sidebar-indexeddb-seeded') === '1') return;
              localStorage.clear();
              sessionStorage.setItem('live-sidebar-indexeddb-seeded', '1');
              const now = Date.now();
              const paper = { size: 'a4', orientation: 'portrait', template: 'blank', color: 'white' };
              const text = { font: 'times', size: 12, color: 'auto', bold: false, italic: false, underline: false, align: 'left' };
              const notePage = {
                id: 'live-page-1',
                title: 'Trang đang mở',
                titleHtml: 'Trang đang mở',
                body: 'ACTIVE_LIVE_CONTENT_1',
                bodyHtml: '<p>ACTIVE_LIVE_CONTENT_1</p>',
                citationPage: null,
                strokes: [],
                excerpts: [],
                paper,
                text,
              };
              const lazyPage = {
                id: 'live-page-2',
                title: 'Trang lazy',
                titleHtml: 'Trang lazy',
                body: 'LAZY_LIVE_CONTENT_2',
                bodyHtml: '<p>LAZY_LIVE_CONTENT_2</p>',
                citationPage: null,
                strokes: [],
                excerpts: [],
                paper,
                text,
              };
              const notebook = {
                id: 'live-notebook-1',
                title: 'Sổ 2 — Ghi chú — live',
                pages: [notePage, lazyPage],
                activePageId: notePage.id,
                createdAt: now,
              };
              const document = {
                id: 'live-document-1',
                name: 'live.pdf',
                size: 123456,
                lastModified: now,
                reader: { page: 1, zoom: 1, fitMode: 'page', rotation: 0, viewMode: 'single', bookmarks: [], annotations: [] },
              };
              localStorage.setItem('mednote-library-v2', JSON.stringify({
                workspaces: [{
                  id: 'live-workspace-1',
                  kind: 'document',
                  name: 'Sổ 2 — Ghi chú — live',
                  documents: [document],
                  activeDocumentId: document.id,
                  notebooks: [notebook],
                  activeNotebookId: notebook.id,
                  sourcePage: 1,
                }],
                activeWorkspaceId: 'live-workspace-1',
                readerShare: 50,
                workspaceMode: 'note',
                noteZoom: 1,
                savedAt: now,
              }));
            });

            const url = `https://madness1997-gif.github.io/mednote-reader/?live-sidebar=${Date.now()}`;
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            if (!response || response.status() !== 200) throw new Error(`Live page status ${response?.status()}`);

            let nav = page.locator('.mednote-page-sheet-nav');
            await nav.waitFor({ state: 'visible', timeout: 15000 });

            // Confirm the real IndexedDB store has persisted the seeded note.
            const deadline = Date.now() + 15000;
            let persistedWorkspace = '';
            while (Date.now() < deadline && persistedWorkspace !== 'live-workspace-1') {
              persistedWorkspace = await page.evaluate(async () => {
                const db = await new Promise((resolve, reject) => {
                  const request = indexedDB.open('mednote-local', 1);
                  request.onsuccess = () => resolve(request.result);
                  request.onerror = () => reject(request.error);
                });
                try {
                  return await new Promise((resolve, reject) => {
                    const request = db.transaction('documents', 'readonly').objectStore('documents').get('library:v5:meta');
                    request.onsuccess = () => resolve(request.result?.activeDocumentContextId || '');
                    request.onerror = () => reject(request.error);
                  });
                } finally {
                  db.close();
                }
              });
              if (persistedWorkspace !== 'live-workspace-1') await page.waitForTimeout(250);
            }
            if (persistedWorkspace !== 'live-workspace-1') throw new Error(`IndexedDB did not persist live workspace: ${persistedWorkspace}`);

            // Recreate the IndexedDB-only startup used by real sessions.
            await page.evaluate(() => {
              localStorage.setItem('mednote-library-v2', JSON.stringify({ storage: 'indexeddb-v5', savedAt: Date.now() }));
            });
            await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });

            // IndexedDB restore is asynchronous. Wait for React to publish the
            // restored live snapshot instead of asserting against its initial
            // default split-mode frame.
            await page.waitForFunction(() => {
              const state = window.__MEDNOTE_LIVE_STATE__;
              return state?.activeWorkspaceId === 'live-workspace-1' && state?.workspaceMode === 'note';
            }, null, { timeout: 15000 });

            const workspace = page.locator('.workspace');
            await workspace.waitFor({ state: 'visible', timeout: 15000 });
            const workspaceClass = await workspace.getAttribute('class') || '';
            if (!workspaceClass.includes('workspace-mode-note')) throw new Error(`Reloaded wrong workspace mode: ${workspaceClass}`);

            nav = page.locator('.mednote-page-sheet-nav');
            await nav.waitFor({ state: 'visible', timeout: 15000 });
            const selectedNotebook = await nav.locator('[data-notebook-select]').inputValue();
            if (selectedNotebook !== 'live-notebook-1') throw new Error(`Wrong sidebar notebook after IndexedDB reload: ${selectedNotebook}`);

            // Only the active page should be hydrated after startup. Page 2 must
            // remain a metadata shell until the user actually opens it.
            const lazyState = await page.evaluate(() => {
              const state = window.__MEDNOTE_LIVE_STATE__;
              const workspace = state?.workspaces?.find(item => item.id === 'live-workspace-1');
              const notebook = workspace?.notebooks?.find(item => item.id === 'live-notebook-1');
              const active = notebook?.pages?.find(item => item.id === 'live-page-1');
              const lazy = notebook?.pages?.find(item => item.id === 'live-page-2');
              return {
                activePageId: notebook?.activePageId,
                activeBody: active?.body,
                activeLazy: active?.__mednoteLazyPage === true,
                lazyBody: lazy?.body,
                lazyFlag: lazy?.__mednoteLazyPage === true,
              };
            });
            if (lazyState.activePageId !== 'live-page-1' || lazyState.activeBody !== 'ACTIVE_LIVE_CONTENT_1' || lazyState.activeLazy) {
              throw new Error(`Active page was not hydrated correctly: ${JSON.stringify(lazyState)}`);
            }
            if (lazyState.lazyBody !== '' || !lazyState.lazyFlag) {
              throw new Error(`Second page was eagerly hydrated: ${JSON.stringify(lazyState)}`);
            }

            // Opening page 2 must hydrate its full body from IndexedDB and render it.
            await page.evaluate(() => window.dispatchEvent(new CustomEvent('mednote:activate-note-page', { detail: 'live-page-2' })));
            await page.waitForFunction(() => {
              const state = window.__MEDNOTE_LIVE_STATE__;
              const workspace = state?.workspaces?.find(item => item.id === 'live-workspace-1');
              const notebook = workspace?.notebooks?.find(item => item.id === 'live-notebook-1');
              const active = notebook?.pages?.find(item => item.id === 'live-page-2');
              return notebook?.activePageId === 'live-page-2'
                && active?.__mednoteLazyPage !== true
                && active?.body === 'LAZY_LIVE_CONTENT_2';
            }, null, { timeout: 10000 });
            const hydratedText = await page.locator('[data-note-page-id="live-page-2"]').innerText();
            if (!hydratedText.includes('LAZY_LIVE_CONTENT_2')) throw new Error(`Hydrated page did not render: ${hydratedText}`);

            // Keep the navigator visible through several runtime maintenance cycles.
            await page.waitForTimeout(4000);
            if (!(await nav.isVisible())) throw new Error('Sidebar disappeared after IndexedDB reload');

            const box = await nav.boundingBox();
            if (!box || box.width < 190 || box.x < 600 || box.x + box.width > 981) {
              throw new Error(`Sidebar is not visibly on the right after IndexedDB reload: ${JSON.stringify(box)}`);
            }
            if (errors.length) throw new Error(`Live browser errors: ${JSON.stringify(errors)}`);

            console.log('LIVE_LAZY_NOTE_AND_SIDEBAR_STABLE', JSON.stringify(box));
            await page.screenshot({ path: 'live-sidebar-stability.png', fullPage: true });
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Upload live sidebar screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-sidebar-stability-${{ github.sha }}
          path: live-sidebar-stability.png
          if-no-files-found: warn
