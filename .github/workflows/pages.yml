name: Publish MedNote Reader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: https://madness1997-gif.github.io/mednote-reader/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:pages
        env:
          VITE_GOOGLE_CLIENT_ID: 647663227509-gcrelfm08dbli66ku94vjgpqj8fn9goi.apps.googleusercontent.com
      - name: Stamp deployment version
        run: echo "${GITHUB_SHA}" > pages-dist/deploy-version.txt
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages-dist
      - name: Create Pages deployment without deploy-pages timeout
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2026-03-10")

          artifact_id=""
          for i in $(seq 1 30); do
            artifacts=$(curl -fsSL "${headers[@]}" "${api}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")
            artifact_id=$(echo "$artifacts" | jq -r --arg name "${ARTIFACT_NAME}" '.artifacts[] | select(.name == $name) | .id' | head -1)
            [ -n "${artifact_id}" ] && [ "${artifact_id}" != "null" ] && break
            sleep 2
          done
          if [ -z "${artifact_id}" ] || [ "${artifact_id}" = "null" ]; then
            echo "Could not resolve Pages artifact id"
            exit 1
          fi
          echo "Artifact: ${artifact_id}"

          oidc=$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')
          if [ -z "${oidc}" ] || [ "${oidc}" = "null" ]; then
            echo "Could not obtain GitHub Actions OIDC token"
            exit 1
          fi

          build_version="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload=$(jq -n \
            --argjson artifact_id "${artifact_id}" \
            --arg version "${build_version}" \
            --arg oidc "${oidc}" \
            '{artifact_id:$artifact_id, environment:"github-pages", pages_build_version:$version, oidc_token:$oidc}')

          response=$(curl -fsSL -X POST "${headers[@]}" \
            "${api}/pages/deployments" \
            -d "${payload}")
          echo "$response" | jq '{id,status_url,page_url}'
          deployment_id=$(echo "$response" | jq -r '.id')
          if [ -z "${deployment_id}" ] || [ "${deployment_id}" = "null" ]; then
            echo "Pages deployment API did not return an id"
            exit 1
          fi

          echo "Deployment id: ${deployment_id}"
          for i in $(seq 1 240); do
            status_json=$(curl -fsSL "${headers[@]}" "${api}/pages/deployments/${deployment_id}")
            status=$(echo "$status_json" | jq -r '.status')
            echo "Pages status ${i}: ${status}"
            case "${status}" in
              succeed)
                echo "Pages deployment succeeded"
                exit 0
                ;;
              failed|failure|error|cancelled|canceled)
                echo "$status_json" | jq .
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Pages deployment is still processing after 20 minutes; leaving it active instead of cancelling it."
          exit 1
      - name: Verify live version
        if: success()
        run: |
          set -euo pipefail
          url="https://madness1997-gif.github.io/mednote-reader/deploy-version.txt"
          for i in $(seq 1 60); do
            live=$(curl -fsSL "${url}?v=${GITHUB_SHA}-${i}" || true)
            if [ "${live}" = "${GITHUB_SHA}" ]; then
              echo "Verified live commit ${GITHUB_SHA}"
              exit 0
            fi
            sleep 5
          done
          echo "Pages API succeeded but live version did not refresh in time"
          exit 1
