name: Publish MedNote Reader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: https://madness1997-gif.github.io/mednote-reader/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:pages
        env:
          VITE_GOOGLE_CLIENT_ID: 647663227509-gcrelfm08dbli66ku94vjgpqj8fn9goi.apps.googleusercontent.com
      - name: Stamp deployment version
        run: echo "${GITHUB_SHA}" > pages-dist/deploy-version.txt
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: pages-dist
      - name: Create and wait for Pages deployment
        id: pages
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const artifactName = 'github-pages';
            const { owner, repo } = context.repo;
            const runId = context.runId;

            let artifact;
            for (let i = 0; i < 30; i++) {
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: runId,
                per_page: 100,
              });
              artifact = result.data.artifacts.find(item => item.name === artifactName);
              if (artifact) break;
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            if (!artifact) throw new Error(`Pages artifact ${artifactName} not found`);
            core.info(`Artifact id: ${artifact.id}`);

            const idToken = await core.getIDToken();
            const created = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner,
              repo,
              artifact_id: artifact.id,
              pages_build_version: context.sha,
              oidc_token: idToken,
            });

            const deploymentId = created.data.id;
            core.info(`Pages deployment id: ${deploymentId}`);
            core.info(`Pages URL: ${created.data.page_url || ''}`);
            core.setOutput('deployment_id', deploymentId);

            for (let i = 1; i <= 240; i++) {
              const response = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                owner,
                repo,
                deploymentId,
              });
              const status = response.data.status;
              core.info(`Pages status ${i}: ${status}`);
              if (status === 'succeed') {
                core.info('Pages deployment succeeded');
                return;
              }
              if (['failed', 'failure', 'error', 'cancelled', 'canceled'].includes(status)) {
                throw new Error(`Pages deployment ended with ${status}`);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }

            throw new Error('Pages deployment is still processing after 20 minutes and was left active.');
      - name: Verify live version
        run: |
          set -euo pipefail
          url="https://madness1997-gif.github.io/mednote-reader/deploy-version.txt"
          for i in $(seq 1 60); do
            live=$(curl -fsSL "${url}?v=${GITHUB_SHA}-${i}" || true)
            if [ "${live}" = "${GITHUB_SHA}" ]; then
              echo "Verified live commit ${GITHUB_SHA}"
              exit 0
            fi
            sleep 5
          done
          echo "Pages API succeeded but live version did not refresh in time"
          exit 1
