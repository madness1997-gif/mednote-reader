name: Publish MedNote Reader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Verify normalized domain, repositories and P1-P9 boundaries
        run: |
          npm run typecheck
          npm run test:unit
      - name: Run browser regression suite
        run: |
          npx playwright install --with-deps chromium
          npm run test:all
      - name: Upload browser regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build:pages
        env:
          VITE_GOOGLE_CLIENT_ID: 647663227509-gcrelfm08dbli66ku94vjgpqj8fn9goi.apps.googleusercontent.com
      - name: Build desktop and verify flush-before-close
        run: |
          npm run build:desktop
          xvfb-run -a node tests/electron-note-hierarchy.cjs
      - name: Stamp deployment version
        run: echo "${GITHUB_SHA}" > pages-dist/deploy-version.txt
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}
          timeout: 600000

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live version
        run: |
          set -euo pipefail
          url="https://madness1997-gif.github.io/mednote-reader/deploy-version.txt"
          for i in $(seq 1 60); do
            live=$(curl -fsSL "${url}?v=${GITHUB_SHA}-${i}" || true)
            if [ "${live}" = "${GITHUB_SHA}" ]; then
              echo "Verified live commit ${GITHUB_SHA}"
              exit 0
            fi
            sleep 5
          done
          echo "Live site did not refresh to ${GITHUB_SHA}"
          exit 1
      - name: Install live browser verifier
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.54.2
          npx playwright install --with-deps chromium
      - name: Verify v6 React sidebar and lazy notes on production
        run: |
          node - <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 980, height: 1500 },
              hasTouch: true,
              isMobile: false,
            });
            const page = await context.newPage();
            const errors = [];
            page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
            page.on('pageerror', err => errors.push(`pageerror: ${err.message}`));

            await page.addInitScript(() => {
              localStorage.clear();
              sessionStorage.clear();
              const now = Date.now();
              const paper = { size: 'a4', orientation: 'portrait', template: 'blank', color: 'white' };
              const text = { font: 'times', size: 12, color: 'auto', bold: false, italic: false, underline: false, align: 'left' };
              const notePage = {
                id: 'live-page-1',
                title: 'Trang đang mở',
                titleHtml: 'Trang đang mở',
                body: 'ACTIVE_LIVE_CONTENT_1',
                bodyHtml: '<p>ACTIVE_LIVE_CONTENT_1</p>',
                citationPage: null,
                strokes: [],
                excerpts: [],
                paper,
                text,
              };
              const lazyPage = {
                id: 'live-page-2',
                title: 'Trang lazy',
                titleHtml: 'Trang lazy',
                body: 'LAZY_LIVE_CONTENT_2',
                bodyHtml: '<p>LAZY_LIVE_CONTENT_2</p>',
                citationPage: null,
                strokes: [],
                excerpts: [],
                paper,
                text,
              };
              const notebook = {
                id: 'live-notebook-1',
                title: 'Sổ 2 — Ghi chú — live',
                pages: [notePage, lazyPage],
                activePageId: notePage.id,
                createdAt: now,
              };
              localStorage.setItem('mednote-library-v2', JSON.stringify({
                workspaces: [{
                  id: 'live-workspace-1',
                  kind: 'empty',
                  name: 'Sổ 2 — Ghi chú — live',
                  documents: [],
                  activeDocumentId: null,
                  notebooks: [notebook],
                  activeNotebookId: notebook.id,
                  sourcePage: 1,
                }],
                activeWorkspaceId: 'live-workspace-1',
                readerShare: 50,
                workspaceMode: 'note',
                noteZoom: 1,
                savedAt: now,
              }));
            });

            const url = `https://madness1997-gif.github.io/mednote-reader/?live-sidebar=${Date.now()}`;
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            if (!response || response.status() !== 200) throw new Error(`Live page status ${response?.status()}`);

            let nav = page.locator('.note-sidebar');
            await nav.waitFor({ state: 'visible', timeout: 15000 });

            const deadline = Date.now() + 15000;
            let persistedMeta = null;
            while (Date.now() < deadline && persistedMeta?.active?.activeSheetId !== 'live-page-1') {
              persistedMeta = await page.evaluate(async () => {
                const db = await new Promise((resolve, reject) => {
                  const request = indexedDB.open('mednote-local', 1);
                  request.onsuccess = () => resolve(request.result);
                  request.onerror = () => reject(request.error);
                });
                try {
                  return await new Promise((resolve, reject) => {
                    const request = db.transaction('documents', 'readonly').objectStore('documents').get('library:v6:meta');
                    request.onsuccess = () => resolve(request.result || null);
                    request.onerror = () => reject(request.error);
                  });
                } finally {
                  db.close();
                }
              });
              if (persistedMeta?.active?.activeSheetId !== 'live-page-1') await page.waitForTimeout(250);
            }
            if (persistedMeta?.version !== 6 || persistedMeta.active?.activeSheetId !== 'live-page-1') {
              throw new Error(`IndexedDB did not persist v6 active state: ${JSON.stringify(persistedMeta)}`);
            }

            await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });

            const workspace = page.locator('.workspace');
            await workspace.waitFor({ state: 'visible', timeout: 15000 });
            await page.waitForFunction(() => document.querySelector('.workspace')?.classList.contains('workspace-mode-note'), null, { timeout: 15000 });
            const workspaceClass = await workspace.getAttribute('class') || '';
            if (!workspaceClass.includes('workspace-mode-note')) throw new Error(`Reloaded wrong workspace mode: ${workspaceClass}`);

            nav = page.locator('.note-sidebar');
            await nav.waitFor({ state: 'visible', timeout: 15000 });
            const selectedNotebook = await nav.locator('select[aria-label="Notebook"]').inputValue();
            if (selectedNotebook !== 'live-notebook-1') throw new Error(`Wrong sidebar notebook after IndexedDB reload: ${selectedNotebook}`);

            const activeText = await page.locator('[data-note-page-id="live-page-1"] .note-editor').innerText();
            if (!activeText.includes('ACTIVE_LIVE_CONTENT_1')) throw new Error(`Active Sheet did not hydrate: ${activeText}`);
            if (await page.locator('[data-note-page-id="live-page-2"]').count()) throw new Error('Inactive Sheet rendered eagerly');
            if (await page.evaluate(() => window.__MEDNOTE_LIVE_STATE__ !== undefined)) throw new Error('Legacy live-state bridge is still published');

            const navigationToken = await page.evaluate(() => {
              window.__wave2LiveToken = crypto.randomUUID();
              return window.__wave2LiveToken;
            });
            await nav.locator('.note-sidebar-page-open', { hasText: 'Trang lazy' }).click();
            await page.locator('[data-note-page-id="live-page-2"] .note-editor').waitFor({ state: 'visible', timeout: 10000 });
            const hydratedText = await page.locator('[data-note-page-id="live-page-2"]').innerText();
            if (!hydratedText.includes('LAZY_LIVE_CONTENT_2')) throw new Error(`Hydrated page did not render: ${hydratedText}`);
            if (await page.evaluate(() => window.__wave2LiveToken) !== navigationToken) throw new Error('Sheet navigation reloaded the page');

            const activeAfterNavigation = await page.evaluate(async () => {
              const db = await new Promise((resolve, reject) => {
                const request = indexedDB.open('mednote-local', 1);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
              });
              try {
                return await new Promise((resolve, reject) => {
                  const request = db.transaction('documents', 'readonly').objectStore('documents').get('library:v6:meta');
                  request.onsuccess = () => resolve(request.result?.active || null);
                  request.onerror = () => reject(request.error);
                });
              } finally {
                db.close();
              }
            });
            if (activeAfterNavigation?.activeSheetId !== 'live-page-2') throw new Error(`v6 active state did not move: ${JSON.stringify(activeAfterNavigation)}`);

            await page.waitForTimeout(4000);
            if (!(await nav.isVisible())) throw new Error('Sidebar disappeared after IndexedDB reload');

            const box = await nav.boundingBox();
            if (!box || box.width < 290 || box.x < 600 || box.x + box.width > 981) {
              throw new Error(`Sidebar is not visibly on the right after IndexedDB reload: ${JSON.stringify(box)}`);
            }
            if (errors.length) throw new Error(`Live browser errors: ${JSON.stringify(errors)}`);

            console.log('LIVE_V6_NOTE_AND_REACT_SIDEBAR_STABLE', JSON.stringify(box));
            await page.screenshot({ path: 'live-sidebar-stability.png', fullPage: true });
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Upload live sidebar screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-sidebar-stability-${{ github.sha }}
          path: live-sidebar-stability.png
          if-no-files-found: warn
