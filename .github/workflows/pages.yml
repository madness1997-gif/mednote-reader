name: Publish MedNote Reader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:pages
        env:
          VITE_GOOGLE_CLIENT_ID: 647663227509-gcrelfm08dbli66ku94vjgpqj8fn9goi.apps.googleusercontent.com
      - name: Stamp deployment version
        run: echo "${GITHUB_SHA}" > pages-dist/deploy-version.txt
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}
          timeout: 600000

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live version
        run: |
          set -euo pipefail
          url="https://madness1997-gif.github.io/mednote-reader/deploy-version.txt"
          for i in $(seq 1 60); do
            live=$(curl -fsSL "${url}?v=${GITHUB_SHA}-${i}" || true)
            if [ "${live}" = "${GITHUB_SHA}" ]; then
              echo "Verified live commit ${GITHUB_SHA}"
              exit 0
            fi
            sleep 5
          done
          echo "Live site did not refresh to ${GITHUB_SHA}"
          exit 1
      - name: Install live browser verifier
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.54.2
          npx playwright install --with-deps chromium
      - name: Open production and verify sidebar stability
        run: |
          node - <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 980, height: 1500 },
              hasTouch: true,
              isMobile: false,
            });
            const page = await context.newPage();
            const errors = [];
            page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
            page.on('pageerror', err => errors.push(`pageerror: ${err.message}`));

            await page.addInitScript(() => {
              localStorage.clear();
              sessionStorage.clear();
              const now = Date.now();
              const notePage = {
                id: 'live-page-1',
                title: 'TÊN CHỦ ĐỀ',
                titleHtml: 'TÊN CHỦ ĐỀ',
                body: 'TỔNG QUAN YẾU TỐ NGUY CƠ CƠ CHẾ LÂM SÀNG CHẨN ĐOÁN ĐIỀU TRỊ',
                bodyHtml: '<p>TỔNG QUAN</p><p>YẾU TỐ NGUY CƠ</p><p>CƠ CHẾ</p><p>LÂM SÀNG</p><p>CHẨN ĐOÁN</p><p>ĐIỀU TRỊ</p>',
                citationPage: null,
                strokes: [],
                excerpts: [],
                paper: { size: 'a4', orientation: 'portrait', template: 'first-aid', color: 'white' },
                text: { font: 'times', size: 12, color: 'auto', bold: false, italic: false, underline: false, align: 'left' },
              };
              const notebook = {
                id: 'live-notebook-1',
                title: 'Ghi chú — live',
                pages: [notePage],
                activePageId: notePage.id,
                createdAt: now,
              };
              const document = {
                id: 'live-document-1',
                name: 'live.pdf',
                size: 123456,
                lastModified: now,
                reader: { page: 1, zoom: 1, fitMode: 'page', rotation: 0, viewMode: 'single', bookmarks: [], annotations: [] },
              };
              localStorage.setItem('mednote-library-v2', JSON.stringify({
                workspaces: [{
                  id: 'live-workspace-1',
                  kind: 'document',
                  name: 'live.pdf',
                  documents: [document],
                  activeDocumentId: document.id,
                  notebooks: [notebook],
                  activeNotebookId: notebook.id,
                  sourcePage: 1,
                }],
                activeWorkspaceId: 'live-workspace-1',
                readerShare: 50,
                workspaceMode: 'note',
                noteZoom: 100,
                savedAt: now,
              }));
            });

            const url = `https://madness1997-gif.github.io/mednote-reader/?live-sidebar=${Date.now()}`;
            const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            if (!response || response.status() !== 200) throw new Error(`Live page status ${response?.status()}`);

            const nav = page.locator('.mednote-page-sheet-nav');
            await nav.waitFor({ state: 'visible', timeout: 15000 });

            // Exact reported failure: tapping Show briefly reveals the sidebar,
            // then another state/polling pass hides it again. Keep it visible for
            // several polling cycles to prove that no re-hide occurs.
            await page.locator('[data-note-navigation-close]').click();
            const restore = page.locator('[data-note-navigation-restore]');
            await restore.waitFor({ state: 'visible', timeout: 5000 });
            await restore.click();
            await page.waitForTimeout(3500);
            if (!(await nav.isVisible())) throw new Error('Sidebar flashed and disappeared after restore');

            // Entering Note is also an explicit request to show the Note sidebar.
            await page.locator('[data-note-navigation-close]').click();
            const noteMode = page.locator('.workspace-mode-switcher button').filter({ hasText: /^Note$/ });
            await noteMode.click();
            await page.waitForTimeout(3500);
            if (!(await nav.isVisible())) throw new Error('Sidebar flashed and disappeared after clicking Note mode');

            const box = await nav.boundingBox();
            if (!box || box.width < 190 || box.x < 600 || box.x + box.width > 981) {
              throw new Error(`Sidebar is not visibly on the right: ${JSON.stringify(box)}`);
            }
            if (errors.length) throw new Error(`Live browser errors: ${JSON.stringify(errors)}`);

            console.log('LIVE_SIDEBAR_STABLE', JSON.stringify(box));
            await page.screenshot({ path: 'live-sidebar-stability.png', fullPage: true });
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Upload live sidebar screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-sidebar-stability-${{ github.sha }}
          path: live-sidebar-stability.png
          if-no-files-found: warn
