name: Publish MedNote Reader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:pages
        env:
          VITE_GOOGLE_CLIENT_ID: 647663227509-gcrelfm08dbli66ku94vjgpqj8fn9goi.apps.googleusercontent.com
      - name: Prepare static site
        run: touch pages-dist/.nojekyll
      - name: Publish gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd pages-dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
      - name: Switch GitHub Pages to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          code=$(curl -sS -o /tmp/pages-response.json -w '%{http_code}' \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d "${payload}")
          cat /tmp/pages-response.json || true
          if [ "${code}" != "200" ] && [ "${code}" != "204" ]; then
            echo "Pages settings update returned HTTP ${code}"
            exit 1
          fi
      - name: Wait for published bundle
        run: |
          set -euo pipefail
          expected="relation-navigation-collapse"
          url="https://madness1997-gif.github.io/mednote-reader/"
          for i in $(seq 1 60); do
            html=$(curl -fsSL "${url}?v=${GITHUB_SHA}-${i}" || true)
            if echo "$html" | grep -q '/mednote-reader/assets/'; then
              asset=$(echo "$html" | grep -oE '/mednote-reader/assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)
              if [ -n "$asset" ]; then
                js=$(curl -fsSL "https://madness1997-gif.github.io${asset}?v=${GITHUB_SHA}-${i}" || true)
                if echo "$js" | grep -q "${expected}"; then
                  echo "New site is live: ${asset}"
                  exit 0
                fi
              fi
            fi
            sleep 5
          done
          echo "Published branch did not become live in time"
          exit 1
