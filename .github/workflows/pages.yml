name: Deploy MedNote Reader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:pages
        env:
          # OAuth client IDs are public identifiers. Never add the client secret
          # to this workflow: this browser-only app uses Google Identity Services.
          VITE_GOOGLE_CLIENT_ID: 647663227509-gcrelfm08dbli66ku94vjgpqj8fn9goi.apps.googleusercontent.com
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}
          timeout: 600000

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.54.2
          npx playwright install --with-deps chromium
      - name: Open deployed site and verify OneNote sidebar visually
        run: |
          node - <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 980, height: 1500 },
              hasTouch: true,
              isMobile: false,
            });
            const page = await context.newPage();
            const consoleErrors = [];
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            page.on('pageerror', err => consoleErrors.push(`pageerror: ${err.message}`));
            await page.addInitScript(() => {
              localStorage.clear();
              sessionStorage.clear();
              const now = Date.now();
              const notePage = {
                id: 'live-page-1', title: 'TÊN CHỦ ĐỀ', titleHtml: 'TÊN CHỦ ĐỀ',
                body: 'TỔNG QUAN YẾU TỐ NGUY CƠ CƠ CHẾ LÂM SÀNG CHẨN ĐOÁN ĐIỀU TRỊ',
                bodyHtml: '<p>TỔNG QUAN</p><p>YẾU TỐ NGUY CƠ</p><p>CƠ CHẾ</p><p>LÂM SÀNG</p><p>CHẨN ĐOÁN</p><p>ĐIỀU TRỊ</p>',
                citationPage: null, strokes: [], excerpts: [],
                paper: { size: 'a4', orientation: 'portrait', template: 'first-aid', color: 'white' },
                text: { font: 'times', size: 12, color: 'auto', bold: false, italic: false, underline: false, align: 'left' },
              };
              const notebook = { id: 'live-notebook-1', title: 'Ghi chú — dc260043', pages: [notePage], activePageId: notePage.id, createdAt: now };
              const document = { id: 'live-document-1', name: 'dc260043.pdf', size: 123456, lastModified: now, reader: { page: 1, zoom: 1, fitMode: 'page', rotation: 0, viewMode: 'single', bookmarks: [], annotations: [] } };
              localStorage.setItem('mednote-library-v2', JSON.stringify({
                workspaces: [{ id: 'live-workspace-1', kind: 'document', name: 'dc260043.pdf', documents: [document], activeDocumentId: document.id, notebooks: [notebook], activeNotebookId: notebook.id, sourcePage: 1 }],
                activeWorkspaceId: 'live-workspace-1', readerShare: 50, workspaceMode: 'note', noteZoom: 100, savedAt: now,
              }));
            });
            const url = `https://madness1997-gif.github.io/mednote-reader/?livecheck=${Date.now()}`;
            const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(3500);
            const result = await page.evaluate(() => {
              const workspace = document.querySelector('.workspace');
              const host = document.querySelector('.note-navigation-host');
              const nav = document.querySelector('.mednote-page-sheet-nav');
              const rect = nav?.getBoundingClientRect();
              const hostRect = host?.getBoundingClientRect();
              const styles = nav ? getComputedStyle(nav) : null;
              const hostStyles = host ? getComputedStyle(host) : null;
              return {
                workspaceClass: workspace?.className || null,
                hostClass: host?.className || null,
                hostDisplay: hostStyles?.display || null,
                hostVisibility: hostStyles?.visibility || null,
                hostRect: hostRect ? { x: hostRect.x, y: hostRect.y, width: hostRect.width, height: hostRect.height } : null,
                navExists: !!nav,
                navDisplay: styles?.display || null,
                navVisibility: styles?.visibility || null,
                navOpacity: styles?.opacity || null,
                navRect: rect ? { x: rect.x, y: rect.y, width: rect.width, height: rect.height, right: rect.right, bottom: rect.bottom } : null,
                innerWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                bodyText: document.body.innerText.slice(0, 500),
                scripts: [...document.scripts].map(s => s.src).filter(Boolean),
              };
            });
            console.log('LIVE_STATUS', response?.status());
            console.log('LIVE_DIAGNOSTICS', JSON.stringify(result, null, 2));
            console.log('LIVE_CONSOLE_ERRORS', JSON.stringify(consoleErrors, null, 2));
            await page.screenshot({ path: 'live-sidebar.png', fullPage: true });
            const r = result.navRect;
            if (!result.navExists || result.navDisplay === 'none' || result.navVisibility === 'hidden' || !r || r.width < 190 || r.x < 600 || r.right > 981) {
              throw new Error(`Deployed OneNote sidebar is not visibly occupying the right side: ${JSON.stringify(result)}`);
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Upload live screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-sidebar-${{ github.sha }}
          path: live-sidebar.png
          if-no-files-found: warn
