name: Validate Drive Sheet hash fix

on:
  push:
    branches:
      - fix/drive-sheet-hash-json

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[drive-hash-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/drive-sheet-hash-json
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --import tsx --test tests-unit/drive-backup-json.test.ts
      - run: npm run test:p6
      - run: npm run build:pages
      - run: npm run build:desktop
      - name: Remove validation workflow
        run: |
          rm .github/workflows/fix-drive-hash.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/fix-drive-hash.yml
          git commit -m "Remove Drive hash validation workflow [drive-hash-bot]"
          git push origin HEAD:fix/drive-sheet-hash-json
