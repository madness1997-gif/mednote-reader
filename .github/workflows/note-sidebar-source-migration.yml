name: One-shot Note Sidebar Source Migration

on:
  push:
    paths:
      - ".github/workflows/note-sidebar-source-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate note sidebar source
        run: |
          sed -i 's/    "note-thumb",/    ".note-thumb",/' .github/scripts/migrate-note-sidebar.py
          python .github/scripts/migrate-note-sidebar.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build:pages

      - name: Verify source and diff
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Replace note thumbnails with OneNote sidebar source"
          git push origin HEAD:main
