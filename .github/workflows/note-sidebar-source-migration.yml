name: One-shot Note Sidebar Source Migration

on:
  push:
    paths:
      - ".github/workflows/note-sidebar-source-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove native note thumbnails and make OneNote sidebar the only source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # 1) React source: remove the native note-thumbnail UI entirely.
          page_path = root / 'app/page.tsx'
          page = page_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'\n        <aside className="note-thumbnails" aria-label="Trang ghi chú">.*?\n        </aside>',
              re.S,
          )
          replacement = '\n        <aside className="note-navigation-host" aria-label="Điều hướng ghi chú" />'
          page, count = pattern.subn(replacement, page, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one native note thumbnail aside, found {count}')

          # Expose a tiny page-activation bridge for PDF export so export no longer
          # depends on clickable thumbnail DOM.
          active_note_anchor = '''  const setActiveNoteId = (pageId: string) => {
            updateActiveNotebook((notebook) => ({ ...notebook, activePageId: pageId }));
          };
          '''
          if active_note_anchor not in page:
              raise SystemExit('Could not find setActiveNoteId anchor')
          active_note_bridge = active_note_anchor + '''
          useEffect(() => {
            const activateNotePage = (event: Event) => {
              const pageId = (event as CustomEvent<string>).detail;
              if (!pageId || !activeNotebook.pages.some((item) => item.id === pageId)) return;
              setActiveNoteId(pageId);
            };
            window.addEventListener("mednote:activate-note-page", activateNotePage);
            return () => window.removeEventListener("mednote:activate-note-page", activateNotePage);
          }, [activeNotebook.id, activeNotebook.pages]);
          '''
          page = page.replace(active_note_anchor, active_note_bridge, 1)
          paper_anchor = '<article className={`note-paper interactive '
          if paper_anchor not in page:
              raise SystemExit('Could not find note-paper anchor')
          page = page.replace(
              paper_anchor,
              '<article data-note-page-id={activeNote.id} className={`note-paper interactive ',
              1,
          )
          page_path.write_text(page, encoding='utf-8')

          # 2) Rename the old thumbnail host everywhere it was only being used as a mount point.
          for base in (root / 'app', root / 'tests'):
              if not base.exists():
                  continue
              for path in base.rglob('*'):
                  if path.suffix not in {'.ts', '.tsx', '.css', '.cjs', '.js'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  updated = text.replace('note-thumbnails', 'note-navigation-host')
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')

          # 3) Remove legacy sidebar layers. The Page→Sheet navigator is already
          # OneNote-styled and becomes the single live note navigation implementation.
          runtime_path = root / 'app/independent-library-runtime.ts'
          runtime = runtime_path.read_text(encoding='utf-8')
          runtime = runtime.replace(
              'void import("./relation-note-sidebar")\n'
              '  .then(() => import("./relation-note-hide-native-thumbnails"))\n'
              '  .then(() => import("./relation-note-right-layout"))',
              'void import("./relation-note-right-layout")',
          )
          if 'relation-note-sidebar' in runtime or 'relation-note-hide-native-thumbnails' in runtime:
              raise SystemExit('Legacy sidebar imports still present in independent-library-runtime.ts')
          runtime_path.write_text(runtime, encoding='utf-8')

          for legacy in (
              root / 'app/relation-note-hide-native-thumbnails.ts',
              root / 'app/relation-note-sidebar.ts',
          ):
              if legacy.exists():
                  legacy.unlink()

          # 4) Point right-layout logic at the real OneNote-style Page→Sheet navigator.
          right_path = root / 'app/relation-note-right-layout.ts'
          right = right_path.read_text(encoding='utf-8')
          right = right.replace(
              'const NAV_SELECTOR = ":scope > .note-navigation-host > .onenote-note-navigation";',
              'const NAV_SELECTOR = ":scope > .note-navigation-host > .mednote-page-sheet-nav";',
          )
          if '.onenote-note-navigation";' in right:
              raise SystemExit('Right-layout still targets the removed legacy navigator')
          right_path.write_text(right, encoding='utf-8')

          # 5) The thumbnail virtualization plugin now virtualizes PDF pages only.
          virtual_path = root / 'app/virtualized-thumbnails.tsx'
          virtual = virtual_path.read_text(encoding='utf-8')
          virtual = virtual.replace('import { Trash2 } from "lucide-react";\n', '')
          virtual = virtual.replace('const DEFAULT_NOTE_ITEM_SIZE = 150;\n', '')
          virtual = re.sub(
              r'\nconst NOTE_PAPER_SWATCH: Record<string, string> = \{.*?\n\};\n',
              '\n',
              virtual,
              count=1,
              flags=re.S,
          )
          virtual, removed_note_component = re.subn(
              r'\ntype NoteThumbPage = \{.*\Z',
              '\n',
              virtual,
              count=1,
              flags=re.S,
          )
          if removed_note_component != 1:
              raise SystemExit('Could not remove VirtualNoteThumbnailList source')
          virtual_path.write_text(virtual, encoding='utf-8')

          vite_virtual_path = root / 'vite.thumbnail-virtualization.ts'
          vite_virtual = vite_virtual_path.read_text(encoding='utf-8')
          vite_virtual = vite_virtual.replace(
              'const IMPORT_LINE = \'import { VirtualNoteThumbnailList, VirtualPdfThumbnailList } from "./virtualized-thumbnails";\';',
              'const IMPORT_LINE = \'import { VirtualPdfThumbnailList } from "./virtualized-thumbnails";\';',
          )
          vite_virtual = re.sub(r'^const NOTE_LIST_START = .*?\n', '', vite_virtual, count=1, flags=re.M)
          vite_virtual = re.sub(r'^const NOTE_LIST_END = .*?\n', '', vite_virtual, count=1, flags=re.M)
          vite_virtual, removed_note_transform = re.subn(
              r'\n      next = replaceRange\(\s*next,\s*NOTE_LIST_START,.*?"danh sách trang note",\s*\);\n',
              '\n',
              vite_virtual,
              count=1,
              flags=re.S,
          )
          if removed_note_transform != 1:
              raise SystemExit('Could not remove note-list virtualization transform')
          vite_virtual_path.write_text(vite_virtual, encoding='utf-8')

          # 6) PDF export activates note pages through the app bridge, not through
          # sidebar thumbnails. This keeps export functional after the thumbnail UI is gone.
          export_path = root / 'app/note-pdf-export.tsx'
          export = export_path.read_text(encoding='utf-8')
          export = export.replace(
              'function buildExportPlans(): ExportPlan[] {\n  const context = currentContext();\n  const thumbnails = Array.from(document.querySelectorAll<HTMLButtonElement>(".note-navigation-host .note-thumb"));\n  if (!context) {\n    return thumbnails.length ? [{\n      scope: "notebook",\n      title: "Notebook",\n      detail: `${thumbnails.length} Sheet`,\n      fileName: "MedNote.pdf",\n      pageIndices: thumbnails.map((_, index) => index),\n    }] : [];\n  }',
              '''function notePageIds() {
            const context = currentContext();
            if (context) return ((context.notebook.pages || []) as SheetPage[]).map((sheet) => String(sheet.id));
            const paper = document.querySelector<HTMLElement>(".note-stage .note-paper[data-note-page-id]");
            return paper?.dataset.notePageId ? [paper.dataset.notePageId] : [];
          }

          function buildExportPlans(): ExportPlan[] {
            const context = currentContext();
            const availablePageIds = notePageIds();
            if (!context) {
              return availablePageIds.length ? [{
                scope: "notebook",
                title: "Notebook",
                detail: `${availablePageIds.length} Sheet`,
                fileName: "MedNote.pdf",
                pageIndices: availablePageIds.map((_, index) => index),
              }] : [];
            }''',
          )
          old_activate = re.compile(
              r'async function activateNotePage\(index: number\) \{.*?\n\}\n\nasync function exportPlanToPdfBytes',
              re.S,
          )
          new_activate = '''async function activateNotePage(index: number) {
            const pageIds = notePageIds();
            const pageId = pageIds[index];
            if (!pageId) throw new Error(`Không tìm thấy Sheet ${index + 1}`);

            let paper = document.querySelector<HTMLElement>(".note-stage .note-paper");
            if (paper?.dataset.notePageId !== pageId) {
              window.dispatchEvent(new CustomEvent("mednote:activate-note-page", { detail: pageId }));
            }

            for (let attempt = 0; attempt < 45; attempt += 1) {
              paper = document.querySelector<HTMLElement>(".note-stage .note-paper");
              if (paper?.dataset.notePageId === pageId) break;
              await nextFrame();
              if (attempt === 44) throw new Error(`Không thể chuyển tới Sheet ${index + 1}`);
            }

            await settleLayout();
            paper = document.querySelector<HTMLElement>(".note-stage .note-paper");
            if (!paper) throw new Error("Không tìm thấy Sheet để xuất");
            return paper;
          }

          async function exportPlanToPdfBytes'''
          export, activate_count = old_activate.subn(new_activate, export, count=1)
          if activate_count != 1:
              raise SystemExit('Could not replace thumbnail-based activateNotePage')

          old_export_head = '''async function exportPlanToPdfBytes(plan: ExportPlan, onProgress: (progress: ExportProgress) => void) {
            const thumbnails = Array.from(document.querySelectorAll<HTMLButtonElement>(".note-navigation-host .note-thumb"));
            if (!thumbnails.length) throw new Error("Notebook chưa có Sheet nào");
            if (!plan.pageIndices.length) throw new Error(`${plan.title} này chưa có Sheet để xuất`);

            const originalIndex = Math.max(0, thumbnails.findIndex((thumbnail) => thumbnail.classList.contains("active")));
            const pdf = await createPdfDocument();'''
          new_export_head = '''async function exportPlanToPdfBytes(plan: ExportPlan, onProgress: (progress: ExportProgress) => void) {
            const pageIds = notePageIds();
            if (!pageIds.length) throw new Error("Notebook chưa có Sheet nào");
            if (!plan.pageIndices.length) throw new Error(`${plan.title} này chưa có Sheet để xuất`);

            const currentPaper = document.querySelector<HTMLElement>(".note-stage .note-paper");
            const originalIndex = Math.max(0, pageIds.indexOf(currentPaper?.dataset.notePageId || pageIds[0]));
            const pdf = await createPdfDocument();'''
          if old_export_head not in export:
              raise SystemExit('Could not replace exportPlan thumbnail prelude')
          export = export.replace(old_export_head, new_export_head, 1)
          export_path.write_text(export, encoding='utf-8')

          export_css_path = root / 'app/note-pdf-export.css'
          export_css = export_css_path.read_text(encoding='utf-8')
          export_css = export_css.replace('.note-pdf-export-active .note-thumb,\n', '')
          export_css_path.write_text(export_css, encoding='utf-8')

          harness_path = root / 'app/pdf-export-e2e-harness.tsx'
          harness = harness_path.read_text(encoding='utf-8')
          harness = re.sub(
              r'\n      <div className="note-navigation-host" style=\{\{ marginTop: 12 \}\}>.*?</div>\n',
              '\n',
              harness,
              count=1,
              flags=re.S,
          )
          harness = harness.replace(
              'className="note-paper"',
              'className="note-paper" data-note-page-id="e2e-sheet-1"',
              1,
          )
          harness_path.write_text(harness, encoding='utf-8')

          # 7) Remove the now-unused rule that hid the legacy navigator.
          navigation_path = root / 'app/page-sheet-navigation.ts'
          navigation = navigation_path.read_text(encoding='utf-8')
          navigation = navigation.replace('.onenote-note-navigation{display:none!important}\n', '')
          navigation_path.write_text(navigation, encoding='utf-8')

          # 8) Clean the OneNote sidebar CSS so there is no fallback thumbnail code.
          clean_path = root / 'app/page-sheet-sidebar-clean.ts'
          clean = clean_path.read_text(encoding='utf-8')
          legacy_block = re.compile(
              r'/\* The Page→Sheet navigator is the single source of truth\. Never stack the legacy navigator under it\. \*/\n'
              r'.*?'
              r'\.note-navigation-host:has\(> \.\$\{NAV_CLASS\}\) > \.\$\{NAV_CLASS\}\{display:grid!important;visibility:visible!important;opacity:1!important\}\n',
              re.S,
          )
          simple_block = (
              '/* The OneNote-style Page→Sheet navigator is the single note navigation source. */\n'
              '.note-navigation-host:has(> .${NAV_CLASS}) > .${NAV_CLASS}{display:grid!important;visibility:visible!important;opacity:1!important}\n'
          )
          clean, clean_count = legacy_block.subn(simple_block, clean, count=1)
          if clean_count != 1:
              raise SystemExit(f'Could not simplify legacy Page→Sheet fallback CSS (matches={clean_count})')
          clean_path.write_text(clean, encoding='utf-8')

          # 9) Globals: preserve PDF thumbnail styles but delete every note-thumbnail-only rule.
          globals_path = root / 'app/globals.css'
          css = globals_path.read_text(encoding='utf-8')
          css = css.replace(
              '.brand-group, .top-actions, .document-title, .pane-toolbar, .note-toolbar, .notes-heading, .rail-heading',
              '.brand-group, .top-actions, .document-title, .pane-toolbar, .note-toolbar, .rail-heading',
          )
          css = css.replace('.pdf-thumb, .note-thumb', '.pdf-thumb')
          css = css.replace('.pdf-thumb.active, .note-thumb.active', '.pdf-thumb.active')
          css = css.replace('.mini-paper, .mini-note', '.mini-paper')
          css = css.replace('.mini-paper i, .mini-note i', '.mini-paper i')
          legacy_css_terms = ('notes-heading', 'note-thumb', 'mini-note', 'new-page')
          css_lines = []
          for line in css.splitlines():
              if any(term in line for term in legacy_css_terms):
                  continue
              css_lines.append(line)
          globals_path.write_text('\n'.join(css_lines) + '\n', encoding='utf-8')

          # 10) Keep the sidebar E2E aligned with the new host and tab-scoped hidden state.
          test_path = root / 'tests/sidebar-controls.spec.cjs'
          if test_path.exists():
              test = test_path.read_text(encoding='utf-8')
              test = test.replace(
                  "  await expect(page.locator('.mednote-page-sheet-nav')).toBeVisible({ timeout: 10_000 });",
                  "  await expect(page.locator('.note-navigation-host > .mednote-page-sheet-nav')).toBeVisible({ timeout: 10_000 });\n"
                  "  await expect(page.locator('.note-navigation-host > :not(.mednote-page-sheet-nav)')).toHaveCount(0);",
              )
              test = test.replace(
                  "const hiddenState = await page.evaluate(() => localStorage.getItem('mednote-note-navigation-hidden'));",
                  "const hiddenState = await page.evaluate(() => sessionStorage.getItem('mednote-note-navigation-hidden'));",
              )
              test_path.write_text(test, encoding='utf-8')

          # 11) Source-level invariant: no native note-thumbnail implementation remains.
          forbidden = (
              'note-thumbnails',
              'note-thumb',
              'mini-note',
              'notes-heading',
              'VirtualNoteThumbnailList',
              'relation-note-hide-native-thumbnails',
          )
          offenders = []
          scan_paths = [root / 'app', root / 'src', root / 'tests', vite_virtual_path]
          for base in scan_paths:
              paths = [base] if base.is_file() else list(base.rglob('*')) if base.exists() else []
              for path in paths:
                  if not path.is_file() or path.suffix not in {'.ts', '.tsx', '.css', '.cjs', '.js'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  for term in forbidden:
                      if term in text:
                          offenders.append(f'{path}: {term}')
          if offenders:
              raise SystemExit('Native note-thumbnail source still exists:\n' + '\n'.join(offenders))

          # The active host and OneNote-style navigator must both exist in source.
          page = page_path.read_text(encoding='utf-8')
          navigation = navigation_path.read_text(encoding='utf-8')
          if 'className="note-navigation-host"' not in page:
              raise SystemExit('New note-navigation-host missing from page.tsx')
          if 'document.querySelector<HTMLElement>(".note-navigation-host")' not in navigation:
              raise SystemExit('Page→Sheet navigator is not mounted into note-navigation-host')
          if 'mednote-page-sheet-nav' not in (root / 'app/page-sheet-state.ts').read_text(encoding='utf-8'):
              raise SystemExit('OneNote-style Page→Sheet nav class missing')
          if 'mednote:activate-note-page' not in page or 'mednote:activate-note-page' not in export_path.read_text(encoding='utf-8'):
              raise SystemExit('Thumbnail-free PDF export activation bridge is incomplete')
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build:pages

      - name: Show migration diff
        run: |
          git status --short
          git diff --check
          git diff --stat

      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Replace note thumbnails with OneNote sidebar source"
          git push origin HEAD:main
