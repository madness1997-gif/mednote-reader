name: One-shot Note Sidebar Source Migration

on:
  push:
    paths:
      - ".github/workflows/note-sidebar-source-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove native note thumbnails and keep the OneNote sidebar only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def replace_once(text, pattern, replacement, label, flags=0):
              regex = re.compile(pattern, flags)
              updated, count = regex.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return updated

          # React: remove the old thumbnail sidebar from the actual component tree.
          page_path = root / 'app/page.tsx'
          page = page_path.read_text(encoding='utf-8')
          page = replace_once(
              page,
              r'\n\s*<aside className="note-thumbnails" aria-label="Trang ghi chú">.*?\n\s*</aside>',
              '\n        <aside className="note-navigation-host" aria-label="Điều hướng ghi chú" />',
              'remove native note thumbnail aside',
              re.S,
          )

          # Add a thumbnail-free page activation bridge for PDF export.
          active_pattern = re.compile(
              r'(\n\s{2}const setActiveNoteId = \(pageId: string\) => \{\n'
              r'\s{4}updateActiveNotebook\(\(notebook\) => \(\{ \.\.\.notebook, activePageId: pageId \}\)\);\n'
              r'\s{2}\};\n)'
          )
          def add_activation_bridge(match):
              return match.group(1) + '''
  useEffect(() => {
    const activateNotePage = (event: Event) => {
      const pageId = (event as CustomEvent<string>).detail;
      if (!pageId || !activeNotebook.pages.some((item) => item.id === pageId)) return;
      setActiveNoteId(pageId);
    };
    window.addEventListener("mednote:activate-note-page", activateNotePage);
    return () => window.removeEventListener("mednote:activate-note-page", activateNotePage);
  }, [activeNotebook.id, activeNotebook.pages]);
'''
          page, bridge_count = active_pattern.subn(add_activation_bridge, page, count=1)
          if bridge_count != 1:
              raise SystemExit(f'add PDF-export page activation bridge: expected 1 match, got {bridge_count}')

          page = replace_once(
              page,
              r'<article className=\{`note-paper interactive ',
              '<article data-note-page-id={activeNote.id} className={`note-paper interactive ',
              'tag active note paper with page id',
          )
          page_path.write_text(page, encoding='utf-8')

          # The old class name described thumbnails. Rename the mount point everywhere first.
          for base in (root / 'app', root / 'tests'):
              for path in base.rglob('*') if base.exists() else []:
                  if not path.is_file() or path.suffix not in {'.ts', '.tsx', '.css', '.cjs', '.js'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  updated = text.replace('note-thumbnails', 'note-navigation-host')
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')

          # Remove the obsolete hidden-thumbnail shim and duplicate legacy sidebar runtime.
          runtime_path = root / 'app/independent-library-runtime.ts'
          runtime = runtime_path.read_text(encoding='utf-8')
          runtime = replace_once(
              runtime,
              r'void import\("\./relation-note-sidebar"\)\s*'
              r'\.then\(\(\) => import\("\./relation-note-hide-native-thumbnails"\)\)\s*'
              r'\.then\(\(\) => import\("\./relation-note-right-layout"\)\)',
              'void import("./relation-note-right-layout")',
              'remove legacy sidebar import chain',
              re.S,
          )
          runtime_path.write_text(runtime, encoding='utf-8')
          for legacy in (root / 'app/relation-note-sidebar.ts', root / 'app/relation-note-hide-native-thumbnails.ts'):
              if legacy.exists():
                  legacy.unlink()

          # The active sidebar is mednote-page-sheet-nav; wire all layout/close code to it.
          right_path = root / 'app/relation-note-right-layout.ts'
          right = right_path.read_text(encoding='utf-8')
          right = right.replace(
              'const NAV_SELECTOR = ":scope > .note-navigation-host > .onenote-note-navigation";',
              'const NAV_SELECTOR = ":scope > .note-navigation-host > .mednote-page-sheet-nav";',
          )
          right = right.replace('>.onenote-note-navigation', '>.mednote-page-sheet-nav')
          right_path.write_text(right, encoding='utf-8')

          collapse_path = root / 'app/relation-navigation-collapse.ts'
          collapse = collapse_path.read_text(encoding='utf-8')
          collapse = collapse.replace(
              ':scope > .mps-bookbar, :scope > .onenote-note-navigation-bookbar',
              ':scope > .mps-bookbar',
          )
          collapse = collapse.replace(
              ':scope > .mednote-page-sheet-nav, :scope > .onenote-note-navigation',
              ':scope > .mednote-page-sheet-nav',
          )
          collapse_path.write_text(collapse, encoding='utf-8')

          navigation_path = root / 'app/page-sheet-navigation.ts'
          navigation = navigation_path.read_text(encoding='utf-8')
          navigation = navigation.replace('.onenote-note-navigation{display:none!important}\n', '')
          navigation_path.write_text(navigation, encoding='utf-8')

          # Delete all note-thumbnail virtualization source; PDF thumbnail virtualization stays.
          virtual_path = root / 'app/virtualized-thumbnails.tsx'
          virtual = virtual_path.read_text(encoding='utf-8')
          virtual = virtual.replace('import { Trash2 } from "lucide-react";\n', '')
          virtual = virtual.replace('const DEFAULT_NOTE_ITEM_SIZE = 150;\n', '')
          virtual = re.sub(r'\nconst NOTE_PAPER_SWATCH: Record<string, string> = \{.*?\n\};\n', '\n', virtual, count=1, flags=re.S)
          virtual = replace_once(
              virtual,
              r'\ntype NoteThumbPage = \{.*\Z',
              '\n',
              'remove VirtualNoteThumbnailList implementation',
              re.S,
          )
          virtual_path.write_text(virtual, encoding='utf-8')

          vite_virtual_path = root / 'vite.thumbnail-virtualization.ts'
          vite_virtual = vite_virtual_path.read_text(encoding='utf-8')
          vite_virtual = vite_virtual.replace(
              'const IMPORT_LINE = \'import { VirtualNoteThumbnailList, VirtualPdfThumbnailList } from "./virtualized-thumbnails";\';',
              'const IMPORT_LINE = \'import { VirtualPdfThumbnailList } from "./virtualized-thumbnails";\';',
          )
          vite_virtual = re.sub(r'^const NOTE_LIST_START = .*?\n', '', vite_virtual, count=1, flags=re.M)
          vite_virtual = re.sub(r'^const NOTE_LIST_END = .*?\n', '', vite_virtual, count=1, flags=re.M)
          vite_virtual = replace_once(
              vite_virtual,
              r'\n\s*next = replaceRange\(\s*next,\s*NOTE_LIST_START,.*?"danh sách trang note",\s*\);\n',
              '\n',
              'remove build-time note thumbnail injection',
              re.S,
          )
          vite_virtual_path.write_text(vite_virtual, encoding='utf-8')

          # Refactor PDF export: switch active sheets by page id, never by thumbnail clicks.
          export_path = root / 'app/note-pdf-export.tsx'
          export = export_path.read_text(encoding='utf-8')
          export = replace_once(
              export,
              r'function buildExportPlans\(\): ExportPlan\[\] \{\n\s*const context = currentContext\(\);\n'
              r'.*?\n\s*const \{ notebook, record, activeSection, activeSheet \} = context;',
              '''function notePageIds() {
  const context = currentContext();
  if (context) return ((context.notebook.pages || []) as SheetPage[]).map((sheet) => String(sheet.id));
  const paper = document.querySelector<HTMLElement>(".note-stage .note-paper[data-note-page-id]");
  return paper?.dataset.notePageId ? [paper.dataset.notePageId] : [];
}

function buildExportPlans(): ExportPlan[] {
  const context = currentContext();
  const availablePageIds = notePageIds();
  if (!context) {
    return availablePageIds.length ? [{
      scope: "notebook",
      title: "Notebook",
      detail: `${availablePageIds.length} Sheet`,
      fileName: "MedNote.pdf",
      pageIndices: availablePageIds.map((_, index) => index),
    }] : [];
  }

  const { notebook, record, activeSection, activeSheet } = context;''',
              'replace thumbnail-dependent export plan fallback',
              re.S,
          )
          export = replace_once(
              export,
              r'async function activateNotePage\(index: number\) \{.*?\n\}\n\nasync function exportPlanToPdfBytes',
              '''async function activateNotePage(index: number) {
  const pageIds = notePageIds();
  const pageId = pageIds[index];
  if (!pageId) throw new Error(`Không tìm thấy Sheet ${index + 1}`);

  let paper = document.querySelector<HTMLElement>(".note-stage .note-paper");
  if (paper?.dataset.notePageId !== pageId) {
    window.dispatchEvent(new CustomEvent("mednote:activate-note-page", { detail: pageId }));
  }

  for (let attempt = 0; attempt < 45; attempt += 1) {
    paper = document.querySelector<HTMLElement>(".note-stage .note-paper");
    if (paper?.dataset.notePageId === pageId) break;
    await nextFrame();
    if (attempt === 44) throw new Error(`Không thể chuyển tới Sheet ${index + 1}`);
  }

  await settleLayout();
  paper = document.querySelector<HTMLElement>(".note-stage .note-paper");
  if (!paper) throw new Error("Không tìm thấy Sheet để xuất");
  return paper;
}

async function exportPlanToPdfBytes''',
              'replace thumbnail-click page activation',
              re.S,
          )
          export = replace_once(
              export,
              r'async function exportPlanToPdfBytes\(plan: ExportPlan, onProgress: \(progress: ExportProgress\) => void\) \{\n'
              r'.*?\n\s*const pdf = await createPdfDocument\(\);',
              '''async function exportPlanToPdfBytes(plan: ExportPlan, onProgress: (progress: ExportProgress) => void) {
  const pageIds = notePageIds();
  if (!pageIds.length) throw new Error("Notebook chưa có Sheet nào");
  if (!plan.pageIndices.length) throw new Error(`${plan.title} này chưa có Sheet để xuất`);

  const currentPaper = document.querySelector<HTMLElement>(".note-stage .note-paper");
  const originalIndex = Math.max(0, pageIds.indexOf(currentPaper?.dataset.notePageId || pageIds[0]));
  const pdf = await createPdfDocument();''',
              'replace export thumbnail prelude',
              re.S,
          )
          export_path.write_text(export, encoding='utf-8')

          export_css_path = root / 'app/note-pdf-export.css'
          export_css = export_css_path.read_text(encoding='utf-8').replace('.note-pdf-export-active .note-thumb,\n', '')
          export_css_path.write_text(export_css, encoding='utf-8')

          harness_path = root / 'app/pdf-export-e2e-harness.tsx'
          harness = harness_path.read_text(encoding='utf-8')
          harness = re.sub(
              r'\n\s*<div className="note-navigation-host" style=\{\{ marginTop: 12 \}\}>.*?</div>\n',
              '\n',
              harness,
              count=1,
              flags=re.S,
          )
          harness = harness.replace('className="note-paper"', 'className="note-paper" data-note-page-id="e2e-sheet-1"', 1)
          harness_path.write_text(harness, encoding='utf-8')

          # Simplify sidebar CSS: only the OneNote Page→Sheet navigator may occupy the host.
          clean_path = root / 'app/page-sheet-sidebar-clean.ts'
          clean = clean_path.read_text(encoding='utf-8')
          clean = replace_once(
              clean,
              r'/\* The Page→Sheet navigator is the single source of truth\. Never stack the legacy navigator under it\. \*/\n'
              r'.*?'
              r'\.note-navigation-host:has\(> \.\$\{NAV_CLASS\}\) > \.\$\{NAV_CLASS\}\{display:grid!important;visibility:visible!important;opacity:1!important\}\n',
              '/* The OneNote-style Page→Sheet navigator is the single note navigation source. */\n'
              '.note-navigation-host:has(> .${NAV_CLASS}) > .${NAV_CLASS}{display:grid!important;visibility:visible!important;opacity:1!important}\n',
              'remove legacy sidebar fallback CSS',
              re.S,
          )
          clean_path.write_text(clean, encoding='utf-8')

          # Globals: preserve PDF thumbnail styling, delete every native note thumbnail rule.
          globals_path = root / 'app/globals.css'
          css = globals_path.read_text(encoding='utf-8')
          css = css.replace(
              '.brand-group, .top-actions, .document-title, .pane-toolbar, .note-toolbar, .notes-heading, .rail-heading',
              '.brand-group, .top-actions, .document-title, .pane-toolbar, .note-toolbar, .rail-heading',
          )
          css = css.replace('.pdf-thumb, .note-thumb', '.pdf-thumb')
          css = css.replace('.pdf-thumb.active, .note-thumb.active', '.pdf-thumb.active')
          css = css.replace('.mini-paper, .mini-note', '.mini-paper')
          css = css.replace('.mini-paper i, .mini-note i', '.mini-paper i')
          css = '\n'.join(
              line for line in css.splitlines()
              if not any(term in line for term in ('notes-heading', 'note-thumb', 'mini-note', 'new-page'))
          ) + '\n'
          globals_path.write_text(css, encoding='utf-8')

          # Update E2E: the host must contain exactly one OneNote-style navigator.
          test_path = root / 'tests/sidebar-controls.spec.cjs'
          if test_path.exists():
              test = test_path.read_text(encoding='utf-8')
              test = test.replace(
                  "  await expect(page.locator('.mednote-page-sheet-nav')).toBeVisible({ timeout: 10_000 });",
                  "  await expect(page.locator('.note-navigation-host > .mednote-page-sheet-nav')).toBeVisible({ timeout: 10_000 });\n"
                  "  await expect(page.locator('.note-navigation-host > :not(.mednote-page-sheet-nav)')).toHaveCount(0);",
              )
              test = test.replace(
                  "const hiddenState = await page.evaluate(() => localStorage.getItem('mednote-note-navigation-hidden'));",
                  "const hiddenState = await page.evaluate(() => sessionStorage.getItem('mednote-note-navigation-hidden'));",
              )
              test_path.write_text(test, encoding='utf-8')

          # Source invariant: no native note-thumbnail implementation may remain.
          forbidden = (
              'note-thumbnails', 'note-thumb', 'mini-note', 'notes-heading',
              'VirtualNoteThumbnailList', 'relation-note-hide-native-thumbnails',
          )
          offenders = []
          scan_roots = [root / 'app', root / 'src', root / 'tests', vite_virtual_path]
          for base in scan_roots:
              paths = [base] if base.is_file() else list(base.rglob('*')) if base.exists() else []
              for path in paths:
                  if not path.is_file() or path.suffix not in {'.ts', '.tsx', '.css', '.cjs', '.js'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  for term in forbidden:
                      if term in text:
                          offenders.append(f'{path}: {term}')
          if offenders:
              raise SystemExit('Native note-thumbnail source still exists:\n' + '\n'.join(offenders))

          required = {
              'page host': 'className="note-navigation-host"' in page_path.read_text(encoding='utf-8'),
              'OneNote nav mount': 'document.querySelector<HTMLElement>(".note-navigation-host")' in navigation_path.read_text(encoding='utf-8'),
              'OneNote nav class': 'mednote-page-sheet-nav' in (root / 'app/page-sheet-state.ts').read_text(encoding='utf-8'),
              'export activation bridge in page': 'mednote:activate-note-page' in page_path.read_text(encoding='utf-8'),
              'export activation bridge in exporter': 'mednote:activate-note-page' in export_path.read_text(encoding='utf-8'),
          }
          missing = [name for name, ok in required.items() if not ok]
          if missing:
              raise SystemExit('Required OneNote-sidebar invariant missing: ' + ', '.join(missing))
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build:pages

      - name: Verify source and diff
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Replace note thumbnails with OneNote sidebar source"
          git push origin HEAD:main
