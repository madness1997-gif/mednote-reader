name: One-shot Note Sidebar Source Migration

on:
  push:
    paths:
      - ".github/workflows/note-sidebar-source-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove native note thumbnails and keep OneNote sidebar only
        run: python -c "import base64; exec(base64.b64decode('      (\)ID0+IGltcG9ydFwoIlwuL3JlbGF0aW9uLW5vdGUtaGlkZS1uYXRpdmUtdGh1bWJuYWlscyJcKVwpXHMqJyByJ1wudGhlblwoXC(\)  bicKICAgICcgaWYgKGNvbnRleHQpIHJldHVyICgoY29udGV4dC5ub3RlYm9vay5wYWdlcyB8fCBbXSkgYXMgU2hlZXRQYWdlW10pLm1hcCgo   bicKICAgICcgICAgfV0gOiBbXTtc bicKICAgICcgIH1cblxuJwogICAgJyAgY29uc3QgeyBub3RlYm9vaywgcmVjb3JkLCBhY3RpdmVTZWN0aW9uLCBhY3RpdmVTaGVldCB9ID0gY29udGV4dDsnCikKZXhwb3J0ID0gcmVwbGFjZV9vbmNlKAogICAgZXhwb3J0LAogICAgcidmdW5jdGlvbiBidWlsZEV4cG9ydFBsYW5zXC(\): bicKICAgICcgaWYgKCFwYWdlSWQpIHRocm93IG5ldyBFcnJvcihgS2jDtG5nIHTDrG0gdGjhuqV5IFNoZWV0ICR7aW5kZXggKyAxfWApO1xuXG4nCiAgICAnICBsZXQgcGFwZXIgPSBkb2N1bWVudC5xdWVyeVNlbGVjdG9yPEhUTUxFbGVtZW50PigiLm5vdGUtc3RhZ2UgLm5vdGUtcGFwZXIiKTtc    cGVyIiBkYXRhLW5vdGUtcGFnZS1pZD0iZTJlLXNoZWV0LTEiJyw   '));"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build:pages

      - name: Verify source and diff
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Replace note thumbnails with OneNote sidebar source"
          git push origin HEAD:main
