name: Repair Existing Notebook Names
on:
  push:
    branches:
      - fix/dedupe-existing-notebook-names-20260812
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dedupe-existing-notebook-names-20260812
          fetch-depth: 0
      - name: Patch migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/note-migration.ts')
          s = p.read_text()
          anchor = 'const clone = <T>(value: T): T => {\n  if (typeof structuredClone === "function") return structuredClone(value);\n  return JSON.parse(JSON.stringify(value)) as T;\n};\n'
          insert = anchor + '\nconst normalizeNotebookTitle = (title: string) => title.normalize("NFKC").trim().replace(/\\s+/g, " ");\nconst notebookTitleKey = (title: string) => normalizeNotebookTitle(title).toLocaleLowerCase("vi-VN");\n\nfunction dedupeNotebookTitles(notebooks: NoteStructure["notebooks"]) {\n  const used = new Set<string>();\n  return ordered(notebooks).map((notebook) => {\n    const base = normalizeNotebookTitle(notebook.title) || "Sổ ghi chú";\n    let title = base;\n    let suffix = 2;\n    while (used.has(notebookTitleKey(title))) title = `${base} (${suffix++})`;\n    used.add(notebookTitleKey(title));\n    return { ...notebook, title };\n  });\n}\n'
          if 'function dedupeNotebookTitles' not in s:
              if anchor not in s: raise SystemExit('clone anchor not found')
              s = s.replace(anchor, insert, 1)
          old = '  const noteStructure: NoteStructure = { ...notes, active: notes.active || defaultActive(notes) };\n'
          new = '  const noteStructure: NoteStructure = { ...notes, notebooks: dedupeNotebookTitles(notes.notebooks), active: notes.active || defaultActive(notes) };\n'
          if old in s: s = s.replace(old, new, 1)
          old2 = '  const current = await repository.loadLibrary();\n  if (current) return { library: current, report: migrationReport(5, current, ["Kho v6 đã tồn tại; migration không ghi lại"] ) };\n'
          new2 = '  const current = await repository.loadLibrary();\n  if (current) {\n    const repairedNotebooks = dedupeNotebookTitles(current.notes.notebooks);\n    const changed = repairedNotebooks.some((notebook, index) => notebook.title !== current.notes.notebooks[index]?.title);\n    if (changed) {\n      const repaired: LibraryV6 = { ...current, notes: { ...current.notes, notebooks: repairedNotebooks }, savedAt: Math.max(Date.now(), current.savedAt + 1) };\n      await repository.replaceLibrary(repaired);\n      const reloaded = await repository.loadLibrary();\n      if (!reloaded) throw new Error("Đã sửa tên Notebook trùng nhưng không load lại được");\n      return { library: reloaded, report: migrationReport(5, reloaded, ["Đã tự đổi tên các Notebook trùng trong kho v6 hiện hữu"] ) };\n    }\n    return { library: current, report: migrationReport(5, current, ["Kho v6 đã tồn tại; migration không ghi lại"] ) };\n  }\n'
          if old2 not in s: raise SystemExit('current v6 anchor not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          Path('.github/workflows/repair-existing-notebook-names.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply existing notebook name repair"
          git push origin HEAD:fix/dedupe-existing-notebook-names-20260812
